<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#151718;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;font-family:'Inter',sans-serif;min-height:100vh}
  .phone{width:393px;height:852px;background:#151718;border-radius:50px;overflow:hidden;box-shadow:0 0 0 1px #1a1a1a,0 24px 80px rgba(0,0,0,.9);display:flex;flex-direction:column;flex-shrink:0;position:relative}
  .status{height:44px;position:relative;flex-shrink:0}
  .header{height:44px;padding:0 22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
  .back-btn{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:0}
  .header-title{font-size:15px;font-weight:500;color:#fff;letter-spacing:.18em;text-transform:uppercase;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* HERO GRADIENT */
  .hero{flex-shrink:0;height:190px;position:relative;overflow:hidden}
  .hero-gradient{width:100%;height:100%}

  /* ABOUT */
  .palette-header{padding:14px 22px 0;flex-shrink:0}
  .palette-editorial{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:6px}
  .collection-progress{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:4px}
  .divider{height:.5px;background:rgba(255,255,255,.1);margin:12px 22px 0;flex-shrink:0}

  /* COLOR ROWS */
  .color-list{padding:0 22px;flex-shrink:0}
  .color-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:.5px solid rgba(255,255,255,.07)}
  .color-row:last-child{border-bottom:none;padding-bottom:0}
  .swatch{width:34px;height:34px;border-radius:3px;flex-shrink:0}
  .color-name{font-size:11px;font-weight:500;color:#fff;letter-spacing:.1em;text-transform:uppercase;flex:1}
  .owned-tag{display:flex;align-items:center;gap:5px;flex-shrink:0}
  .owned-tag span{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3)}

  /* CTA */
  .cta-section{padding:18px 22px 18px;flex-shrink:0}
  .cta-btn{display:block;width:100%;border:1.5px solid rgba(255,255,255,1);background:transparent;color:#fff;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:13px;border-radius:100px;text-align:center;cursor:pointer;text-decoration:none}

  .scroll-area{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none}
  .scroll-area::-webkit-scrollbar{display:none}

  /* TAB BAR */
  .tabs{height:72px;border-top:.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;flex-shrink:0}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none}
  .tab-ic{width:24px;height:24px;opacity:1;display:flex;align-items:center;justify-content:center}
  .tab-ic svg{height:22px;width:22px}
  .tab-lbl{font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:#fff;font-weight:500}
  .home-bar{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .hb{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="phone">

  <div class="status">
    <span style="position:absolute;left:28px;top:14px;font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em">9:41</span>
    <div style="position:absolute;right:18px;top:16px;display:flex;align-items:center;gap:6px">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="6" width="3" height="6" rx="0.5" opacity="0.3"/><rect x="4.5" y="4" width="3" height="8" rx="0.5" opacity="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5" opacity="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="white"/><path d="M4.9 7.4a4.4 4.4 0 0 1 6.2 0" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M2.4 5a7.2 7.2 0 0 1 11.2 0" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" stroke-width="1" fill="none" opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="white"/><path d="M22.5 4v4a2 2 0 0 0 0-4z" fill="white" opacity="0.4"/></svg>
    </div>
  </div>

  <div class="header">
    <a href="screen-profile.html" class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"><path fill="white" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg>
    </a>
    <div class="header-title" id="page-title"></div>
  </div>

  <div class="scroll-area">

    <div class="hero">
      <div class="hero-gradient" id="hero-gradient"></div>
    </div>

    <div class="palette-header">
      <div class="palette-editorial" id="palette-name"></div>
      <div class="collection-progress" id="collection-count"></div>
    </div>

    <div class="divider"></div>

    <div class="color-list" id="color-list"></div>

    <div class="cta-section">
      <div class="cta-btn">Explore Designs</div>
    </div>

  </div>

  <div class="tabs">
    <a class="tab" href="screen-closet.html"><div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg></div><span class="tab-lbl" style="opacity:.5">Closet</span></a>
    <a class="tab" href="screen-explore.html"><div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" style="opacity:.5"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg></div><span class="tab-lbl" style="opacity:.5">Explore</span></a>
    <a class="tab" href="Index.html"><div class="tab-ic"><svg width="22" height="22" fill="none" style="transform:rotate(-30deg)"><ellipse cx="11" cy="11" rx="9" ry="6.5" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="5.5" ry="4" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="2" ry="1.5" stroke="white" stroke-width="1.3" opacity=".5"/></svg></div><span class="tab-lbl" style="opacity:.5">Luminora</span></a>
    <a class="tab" href="screen-profile.html"><div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg></div><span class="tab-lbl">Profile</span></a>
  </div>
  <div class="home-bar"><div class="hb"></div></div>

</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const idx = parseInt(params.get('i') || '0', 10);
  const collections = JSON.parse(localStorage.getItem('aim_collections') || '[]');
  const col = collections[idx];

  if (!col) {
    document.getElementById('page-title').textContent = 'Not Found';
  } else {
    const familyNames = {
      white: 'White', redOrange: 'Red / Orange', pinkPurple: 'Pink / Purple',
      blue: 'Blue', green: 'Green', yellow: 'Yellow'
    };

    document.getElementById('page-title').textContent = col.name;
    document.getElementById('hero-gradient').style.background = col.gradient;
    document.getElementById('palette-name').textContent = col.name;
    document.getElementById('collection-count').textContent =
      `${col.colours.length} colour${col.colours.length !== 1 ? 's' : ''} in your collection`;

    document.getElementById('color-list').innerHTML = col.colours.map(c => {
      const label = c.family ? (familyNames[c.family] || c.family) : c.hex;
      return `<div class="color-row">
        <div class="swatch" style="background:${c.hex}"></div>
        <span class="color-name">${label}</span>
        <div class="owned-tag">
          <svg width="11" height="11" viewBox="0 0 24 24"><path fill="rgba(255,255,255,.3)" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          <span>In your collection</span>
        </div>
      </div>`;
    }).join('');
  }
</script>
</body>
</html>
