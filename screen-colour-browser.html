<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#151718;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;font-family:'Inter',sans-serif;min-height:100vh}
  .phone{width:393px;height:852px;background:#151718;border-radius:50px;overflow:hidden;box-shadow:0 0 0 1px #1a1a1a,0 24px 80px rgba(0,0,0,.9);display:flex;flex-direction:column;flex-shrink:0;position:relative}

  /* STATUS */
  .status{height:44px;position:relative;flex-shrink:0}

  /* HEADER */
  .cb-header{height:44px;padding:0 16px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;position:relative}
  .cb-back{background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:0;color:#fff}
  .cb-title{position:absolute;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:#fff;white-space:nowrap}
  .cb-count{font-family:'Inter',sans-serif;font-size:10px;font-weight:500;letter-spacing:.1em;color:rgba(255,255,255,.45)}

  /* PANE */
  .cb-pane{display:flex;flex-direction:column;flex:1;min-height:0}
  .cb-pane.hidden{display:none}

  /* FAMILY TABS */
  .cb-families{display:flex;gap:6px;padding:10px 14px 10px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
  .cb-families::-webkit-scrollbar{display:none}
  .cb-family-btn{flex-shrink:0;background:none;border:0.5px solid rgba(255,255,255,.25);color:rgba(255,255,255,.45);font-family:'Inter',sans-serif;font-size:8px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:5px 12px;cursor:pointer;transition:all .2s;white-space:nowrap}
  .cb-family-btn.active{border-color:#fff;color:#fff}

  /* SWATCH GRID */
  .cb-grid-wrap{flex:1;overflow-y:auto;scrollbar-width:none;padding:8px 12px 24px}
  .cb-grid-wrap::-webkit-scrollbar{display:none}
  .cb-grid{display:grid;grid-template-columns:repeat(5,69px);gap:6px;justify-content:center}
  .cb-swatch{position:relative;aspect-ratio:1;cursor:pointer;border:2px solid transparent;border-radius:3px;transition:border-color .15s;overflow:hidden}
  .cb-swatch.selected{border-color:#fff}
  .cb-swatch-inner{width:100%;height:100%;display:block;border-radius:1px}
  .cb-check{position:absolute;top:4px;right:4px;width:16px;height:16px;background:#fff;border-radius:50%;display:none;align-items:center;justify-content:center}
  .cb-swatch.selected .cb-check{display:flex}
  .cb-check svg{width:10px;height:10px}

  /* BOTTOM BAR */
  .cb-bar{flex-shrink:0;padding:12px 14px 14px;border-top:0.5px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .cb-bar-info{font-family:'Inter',sans-serif;font-size:9px;font-weight:400;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.4)}
  .cb-next{background:none;border:1.5px solid #fff;color:#fff;font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:10px 22px;cursor:pointer;border-radius:100px;transition:opacity .2s;white-space:nowrap}
  .cb-next:disabled{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.2);cursor:default}

  /* ── NAME PANE ── */
  .nm-swatches{display:flex;gap:5px;padding:14px 14px 0;flex-wrap:wrap;flex-shrink:0}
  .nm-swatch{width:34px;height:34px;border-radius:3px;flex-shrink:0}

  .nm-divider{height:.5px;background:rgba(255,255,255,.1);margin:14px 14px 0;flex-shrink:0}

  .nm-label{font-family:'Inter',sans-serif;font-size:8px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:16px 14px 8px;flex-shrink:0}

  .nm-input{background:none;border:none;border-bottom:0.5px solid rgba(255,255,255,.3);color:#fff;font-family:'Inter',sans-serif;font-size:20px;font-weight:300;letter-spacing:.02em;padding:0 14px 10px;width:100%;outline:none;flex-shrink:0}
  .nm-input::placeholder{color:rgba(255,255,255,.2)}

  .nm-spacer{flex:1}

  .nm-create-wrap{padding:16px 14px 18px;flex-shrink:0}
  .nm-create{display:block;width:100%;background:none;border:1.5px solid #fff;color:#fff;font-family:'Inter',sans-serif;font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;padding:13px;text-align:center;cursor:pointer;border-radius:100px;transition:opacity .2s}
  .nm-create:disabled{border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.2);cursor:default}

  /* TAB BAR */
  .tabs{height:72px;border-top:.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;flex-shrink:0}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none}
  .tab-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .tab-ic svg{height:22px;width:22px}
  .tab-lbl{font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:#fff;font-weight:500}
  .home-bar{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .hb{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="phone">

  <!-- Status Bar -->
  <div class="status">
    <span style="position:absolute;left:28px;top:14px;font-size:15px;font-weight:600;color:#fff;letter-spacing:.02em">9:41</span>
    <div style="position:absolute;right:18px;top:16px;display:flex;align-items:center;gap:6px">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="6" width="3" height="6" rx="0.5" opacity="0.3"/><rect x="4.5" y="4" width="3" height="8" rx="0.5" opacity="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5" opacity="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="white"/><path d="M4.9 7.4a4.4 4.4 0 0 1 6.2 0" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M2.4 5a7.2 7.2 0 0 1 11.2 0" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" stroke-width="1" fill="none" opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="white"/><path d="M22.5 4v4a2 2 0 0 0 0-4z" fill="white" opacity="0.4"/></svg>
    </div>
  </div>

  <!-- ── PANE 1: BROWSE ── -->
  <div class="cb-pane" id="pane-browse">

    <div class="cb-header">
      <button class="cb-back" onclick="history.back()">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><path fill="white" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg>
      </button>
      <span class="cb-title">New Collection</span>
      <span class="cb-count" id="browse-count">0 / 10</span>
    </div>

    <!-- Family filter tabs -->
    <div class="cb-families">
      <button class="cb-family-btn active" onclick="filterFamily('all', this)">All</button>
      <button class="cb-family-btn" onclick="filterFamily('white', this)">White</button>
      <button class="cb-family-btn" onclick="filterFamily('redOrange', this)">Red / Orange</button>
      <button class="cb-family-btn" onclick="filterFamily('pinkPurple', this)">Pink / Purple</button>
      <button class="cb-family-btn" onclick="filterFamily('blue', this)">Blue</button>
      <button class="cb-family-btn" onclick="filterFamily('green', this)">Green</button>
      <button class="cb-family-btn" onclick="filterFamily('yellow', this)">Yellow</button>
    </div>

    <!-- Swatch grid -->
    <div class="cb-grid-wrap">
      <div class="cb-grid" id="swatch-grid"></div>
    </div>

    <!-- Bottom bar -->
    <div class="cb-bar">
      <span class="cb-bar-info" id="bar-info">Select up to 10 colours</span>
      <button class="cb-next" id="next-btn" onclick="goToName()" disabled>Next →</button>
    </div>

  </div><!-- /pane-browse -->

  <!-- ── PANE 2: NAME ── -->
  <div class="cb-pane hidden" id="pane-name">

    <div class="cb-header">
      <button class="cb-back" onclick="goToBrowse()">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><path fill="white" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg>
      </button>
      <span class="cb-title">Name Your Collection</span>
      <span></span>
    </div>

    <div class="nm-swatches" id="nm-swatches"></div>

    <div class="nm-divider"></div>
    <div class="nm-label">Collection Name</div>
    <input class="nm-input" id="nm-input" type="text" placeholder="e.g. Summer Palette" oninput="updateCreate()">

    <div class="nm-spacer"></div>

    <div class="nm-create-wrap">
      <button class="nm-create" id="create-btn" onclick="createCollection()" disabled>Create Collection</button>
    </div>

  </div><!-- /pane-name -->

  <!-- Tab Bar -->
  <div class="tabs">
    <a class="tab" href="screen-closet.html"><div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg></div><span class="tab-lbl" style="opacity:.5">Closet</span></a>
    <a class="tab" href="screen-explore.html"><div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" style="opacity:.5"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg></div><span class="tab-lbl" style="opacity:.5">Explore</span></a>
    <a class="tab" href="Index.html"><div class="tab-ic"><svg width="22" height="22" fill="none" style="transform:rotate(-30deg)"><ellipse cx="11" cy="11" rx="9" ry="6.5" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="5.5" ry="4" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="2" ry="1.5" stroke="white" stroke-width="1.3" opacity=".5"/></svg></div><span class="tab-lbl" style="opacity:.5">Luminora</span></a>
    <a class="tab" href="screen-profile.html"><div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg></div><span class="tab-lbl">Profile</span></a>
  </div>
  <div class="home-bar"><div class="hb"></div></div>

</div>

<script src="colours.js"></script>
<script>
  const MAX = 10;
  const selectedMap = new Map(); // key → { hex, lab, code, family }
  let currentFamily = 'all';

  // Build a lookup: hex+code → { ...colour, family }
  const colourLookup = new Map();
  AIM_COLOURS.families.forEach(fam => {
    AIM_COLOURS[fam].forEach((c, i) => {
      const key = `${c.hex}-${c.code || fam + i}`;
      colourLookup.set(key, { ...c, family: fam });
    });
  });

  function renderGrid() {
    const grid = document.getElementById('swatch-grid');
    const colours = currentFamily === 'all'
      ? AIM_COLOURS.all
      : AIM_COLOURS[currentFamily] || [];
    const fam = currentFamily === 'all' ? null : currentFamily;

    grid.innerHTML = colours.map((c, i) => {
      const famTag = fam || AIM_COLOURS.families.find(f => AIM_COLOURS[f].includes(c)) || 'all';
      const key = `${c.hex}-${c.code || famTag + i}`;
      const isSel = selectedMap.has(key);
      return `<div class="cb-swatch${isSel ? ' selected' : ''}" onclick="toggleSwatch('${key}',this)" data-key="${key}">
        <div class="cb-swatch-inner" style="background:${c.hex}"></div>
        <div class="cb-check"><svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round"><path d="M5 12l5 5L19 7"/></svg></div>
      </div>`;
    }).join('');
  }

  function toggleSwatch(key, el) {
    if (selectedMap.has(key)) {
      selectedMap.delete(key);
      el.classList.remove('selected');
    } else {
      if (selectedMap.size >= MAX) return;
      const data = colourLookup.get(key);
      if (data) selectedMap.set(key, data);
      el.classList.add('selected');
    }
    updateUI();
  }

  function updateUI() {
    const n = selectedMap.size;
    document.getElementById('browse-count').textContent = `${n} / ${MAX}`;
    document.getElementById('bar-info').textContent =
      n === 0 ? 'Select up to 10 colours' :
      n === MAX ? '10 colours selected' :
      `${n} colour${n !== 1 ? 's' : ''} selected`;
    document.getElementById('next-btn').disabled = n === 0;
  }

  function filterFamily(family, btn) {
    currentFamily = family;
    document.querySelectorAll('.cb-family-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGrid();
  }

  function goToName() {
    const colours = [...selectedMap.values()];
    const nmContainer = document.getElementById('nm-swatches');
    nmContainer.innerHTML = colours.map(c =>
      `<div class="nm-swatch" style="background:${c.hex}"></div>`
    ).join('');
    document.getElementById('nm-input').value = '';
    document.getElementById('create-btn').disabled = true;
    document.getElementById('pane-browse').classList.add('hidden');
    document.getElementById('pane-name').classList.remove('hidden');
  }

  function goToBrowse() {
    document.getElementById('pane-name').classList.add('hidden');
    document.getElementById('pane-browse').classList.remove('hidden');
  }

  function updateCreate() {
    const val = document.getElementById('nm-input').value.trim();
    document.getElementById('create-btn').disabled = val.length === 0;
  }

  function makeGradient(colours) {
    if (colours.length === 1) return colours[0].hex;
    const stops = colours.map((c, i) =>
      `${c.hex} ${Math.round(i / (colours.length - 1) * 100)}%`
    );
    return `linear-gradient(135deg, ${stops.join(', ')})`;
  }

  function createCollection() {
    const name = document.getElementById('nm-input').value.trim();
    if (!name) return;
    const colours = [...selectedMap.values()];
    const collection = { name, colours, gradient: makeGradient(colours), created: Date.now() };
    const existing = JSON.parse(localStorage.getItem('aim_collections') || '[]');
    existing.push(collection);
    localStorage.setItem('aim_collections', JSON.stringify(existing));
    window.location.href = 'screen-profile.html';
  }

  // Init
  renderGrid();
</script>
</body>
</html>
