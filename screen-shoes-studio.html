<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1.0" />
<title>Aim Colours — Shoe Studio</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#151718;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;font-family:'Inter',sans-serif;min-height:100vh}

  .phone{width:393px;height:852px;background:#151718;border-radius:50px;overflow:hidden;box-shadow:0 0 0 1px #1a1a1a,0 24px 80px rgba(0,0,0,.9);display:flex;flex-direction:column;flex-shrink:0;position:relative}

  /* STATUS */
  .status{height:44px;position:relative;flex-shrink:0}

  /* HEADER — matches Allie's Studio (screen-closet.html) */
  .header{height:44px;padding:14px 22px 0;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
  .header-title{font-size:27px;font-weight:400;color:#fff;letter-spacing:.04em;text-transform:uppercase;position:relative;top:-7px}

  /* SHOE PREVIEW — same slot as .pendant-wrap, holding an <img> for now */
  .pendant-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:20px 22px 0}
  .pendant-wrap img{width:100%;object-fit:contain}

  .swatches{padding:0 22px 0;flex-shrink:0}
  .row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px}
  .sw{aspect-ratio:1;border-radius:2px;position:relative;cursor:pointer}
  .sw.sel{outline:1.5px solid rgba(255,255,255,.85);outline-offset:1px;border-radius:2px}

  .pal-sel{position:relative;flex:1;display:flex;justify-content:center;align-items:center}
  .pal-trigger{display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px 10px;margin-top:4px}
  .pal-trigger-name{font-family:'Inter',sans-serif;font-size:15px;line-height:1;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pal-chevron{flex-shrink:0;transition:transform .2s}
  .pal-drop{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);width:260px;background:#1c1c20;border:.5px solid rgba(255,255,255,.15);border-radius:8px;overflow:hidden;display:none;z-index:50;max-height:210px;overflow-y:auto;scrollbar-width:none}
  .pal-drop.open{display:block}
  .pal-opt{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:.5px solid rgba(255,255,255,.07)}
  .pal-opt:last-child{border-bottom:none}
  .pal-opt-thumb{width:30px;height:30px;border-radius:3px;flex-shrink:0}
  .pal-opt-name{font-family:'Inter',sans-serif;font-size:9px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:#fff}

  .cta-wrap{flex-shrink:0;padding:14px 22px 28px}
  .cta{width:100%;border:1.5px solid rgba(255,255,255,1);background:transparent;color:#fff;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:13px;border-radius:100px;text-align:center;cursor:pointer}

  /* TAB BAR (shared) — matches screen-closet.html */
  .tabs{height:72px;border-top:.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;flex-shrink:0}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .tab-ic{width:24px;height:24px;opacity:1;display:flex;align-items:center;justify-content:center}
  .tab-ic svg{height:22px;width:22px;}
  .tab-lbl{font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:#fff;font-weight:500}
  .home-bar{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .hb{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="phone">

  <!-- Status Bar -->
  <div class="status">
    <img src="status-time.svg" alt="9:41" style="position:absolute;left:21px;top:12px;width:54px;height:21px;filter:brightness(0) invert(1)"/>
    <img src="status-icons.svg" alt="status icons" style="position:absolute;right:14.67px;top:17.33px;width:66.661px;height:11.336px;filter:brightness(0) invert(1)"/>
  </div>

  <!-- Header -->
  <div class="header">
    <button onclick="window.location.href='screen-shoes.html'" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:0">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"><path fill="white" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg>
    </button>
    <div class="header-title">Allie's Studio</div>
    <div style="position:absolute;right:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px">
      <svg xmlns="http://www.w3.org/2000/svg" onclick="resetPendant()" width="20" height="20" viewBox="0 0 24 24" style="cursor:pointer;position:relative;left:2px"><path fill="white" d="m8.4 17l3.6-3.6l3.6 3.6l1.4-1.4l-3.6-3.6L17 8.4L15.6 7L12 10.6L8.4 7L7 8.4l3.6 3.6L7 15.6zm3.6 5q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8"/></svg>
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="white" d="M5 21V3h14v18l-7-3zm2-3.05l5-2.15l5 2.15V5H7zM7 5h10z"/></svg>
    </div>
  </div>

  <!-- Shoe preview — will become an inline SVG (like the pendant) once a
       colourable shoe SVG exists; keeps id="pendant-inline" so the swatch
       logic below picks it up automatically at that point. -->
  <div class="pendant-wrap">
    <img id="pendant-inline" src="" alt="Shoe">
  </div>

  <div style="display:flex;align-items:center;padding:16px 22px 16px;flex-shrink:0;position:relative">
    <svg id="btn-undo" xmlns="http://www.w3.org/2000/svg" onclick="pendantUndo()" width="27" height="27" viewBox="0 0 24 24" style="cursor:pointer;opacity:.5;transition:opacity 150ms ease;flex-shrink:0"><path fill="white" d="M7 19v-2h7.1q1.575 0 2.738-1T18 13.5T16.838 11T14.1 10H7.8l2.6 2.6L9 14L4 9l5-5l1.4 1.4L7.8 8h6.3q2.425 0 4.163 1.575T20 13.5t-1.737 3.925T14.1 19z"/></svg>

    <div class="pal-sel" id="pal-sel">
      <div class="pal-trigger" onclick="togglePalDrop()">
        <span class="pal-trigger-name" id="pal-name">Studio Default</span>
        <svg class="pal-chevron" id="pal-chevron" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" style="color:rgba(255,255,255,0.45);position:relative;top:-1px"><path d="M0 0h24v24H0z" fill="none"/><path fill="currentColor" d="m12 15l-4.243-4.242l1.415-1.414L12 12.172l2.828-2.828l1.415 1.414z"/></svg>
      </div>
      <div class="pal-drop" id="pal-drop"></div>
    </div>

    <svg id="btn-redo" xmlns="http://www.w3.org/2000/svg" onclick="pendantRedo()" width="27" height="27" viewBox="0 0 24 24" style="cursor:pointer;opacity:.5;transition:opacity 150ms ease;flex-shrink:0"><path fill="white" d="M9.9 19q-2.425 0-4.163-1.575T4 13.5t1.738-3.925T9.9 8h6.3l-2.6-2.6L15 4l5 5l-5 5l-1.4-1.4l2.6-2.6H9.9q-1.575 0-2.738 1T6 13.5T7.163 16T9.9 17H17v2z"/></svg>
  </div>

  <div class="swatches" id="swatches2">
    <div class="row">
      <div class="sw sel" style="background:#a9a29b" data-color="#a9a29b"></div>
      <div class="sw" style="background:#9e5959" data-color="#9e5959"></div>
      <div class="sw" style="background:#5a7f50" data-color="#5a7f50"></div>
      <div class="sw" style="background:#476e9c" data-color="#476e9c"></div>
      <div class="sw" style="background:#766473" data-color="#766473"></div>
    </div>
    <div class="row">
      <div class="sw" style="background:#a47c81" data-color="#a47c81"></div>
      <div class="sw" style="background:#7f1712" data-color="#7f1712"></div>
      <div class="sw" style="background:#1a5143" data-color="#1a5143"></div>
      <div class="sw" style="background:#1f4786" data-color="#1f4786"></div>
      <div class="sw" style="background:#362344" data-color="#362344"></div>
    </div>
  </div>
  <div class="cta-wrap"><div class="cta">Transfer</div></div>

  <!-- TAB BAR (shared) -->
  <div class="tabs">
    <a class="tab" href="screen-closet.html" style="text-decoration:none">
      <div class="tab-ic">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg>
      </div>
      <span class="tab-lbl">Closet</span>
    </a>
    <a class="tab" href="screen-explore.html" style="text-decoration:none">
      <div class="tab-ic">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" style="opacity:.5"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg>
      </div>
      <span class="tab-lbl" style="opacity:.5">Explore</span>
    </a>
    <a class="tab" href="Index.html" style="text-decoration:none">
      <div class="tab-ic">
        <svg width="22" height="22" fill="none" style="transform:rotate(-30deg)">
          <ellipse cx="11" cy="11" rx="9" ry="6.5" stroke="white" stroke-width="1.3" opacity=".5"/>
          <ellipse cx="11" cy="11" rx="5.5" ry="4" stroke="white" stroke-width="1.3" opacity=".5"/>
          <ellipse cx="11" cy="11" rx="2" ry="1.5" stroke="white" stroke-width="1.3" opacity=".5"/>
        </svg>
      </div>
      <span class="tab-lbl" style="opacity:.5">Luminora</span>
    </a>
    <a class="tab" href="screen-profile.html" style="text-decoration:none">
      <div class="tab-ic">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg>
      </div>
      <span class="tab-lbl" style="opacity:.5">Profile</span>
    </a>
  </div>

  <div class="home-bar"><div class="hb"></div></div>

</div>

<script>
  // Load the shoe passed from screen-shoes.html
  var params = new URLSearchParams(location.search);
  var shoeImg = document.getElementById('pendant-inline');
  shoeImg.src = params.get('img') || 'assets/shoes_red.png';
  shoeImg.alt = params.get('alt') || 'Shoe';

  // ── Colour picker — identical to Allie's Studio (screen-closet.html).
  // Targets #pendant-inline .cls-1 / .cls-3 / .cls-4, same as the pendant
  // version, so swapping the <img> above for a colourable shoe SVG with
  // those same class names will make this fully functional with no other
  // changes needed. ──
  var pendantColor = '#A89080';
  var sectionColors = {'cls-1': null, 'cls-3': null, 'cls-4': null};
  var origColors   = {'cls-1': '#a47c81', 'cls-3': '#362344', 'cls-4': '#a9a29b'};
  var undoStack = [], redoStack = [];

  function applySection(cls, color) {
    sectionColors[cls] = color;
    document.querySelectorAll('#pendant-inline .'+cls).forEach(function(el) {
      el.style.fill = color || origColors[cls];
    });
  }

  function updateUndoRedoState() {
    document.getElementById('btn-undo').style.opacity = undoStack.length ? '1' : '.5';
    document.getElementById('btn-redo').style.opacity = redoStack.length ? '1' : '.5';
  }

  function resetPendant() {
    ['cls-1','cls-3','cls-4'].forEach(function(cls) {
      applySection(cls, origColors[cls]);
    });
    sectionColors = {'cls-1': null, 'cls-3': null, 'cls-4': null};
    undoStack = []; redoStack = [];
    var swatches = document.querySelectorAll('#swatches2 .sw');
    swatches.forEach(function(s) { s.classList.remove('sel'); });
    if (swatches.length) {
      swatches[0].classList.add('sel');
      pendantColor = swatches[0].dataset.color;
    }
    updateUndoRedoState();
  }

  function pendantUndo() {
    if (!undoStack.length) return;
    var action = undoStack.pop();
    redoStack.push(action);
    applySection(action.cls, action.prev);
    updateUndoRedoState();
  }

  function pendantRedo() {
    if (!redoStack.length) return;
    var action = redoStack.pop();
    undoStack.push(action);
    applySection(action.cls, action.next);
    updateUndoRedoState();
  }

  // Swatch selection — event delegation so it works after palette swaps
  document.getElementById('swatches2').addEventListener('click', function(e) {
    var sw = e.target.closest('.sw');
    if (!sw) return;
    document.querySelectorAll('#swatches2 .sw').forEach(function(s){ s.classList.remove('sel'); });
    sw.classList.add('sel');
    pendantColor = sw.dataset.color;
  });

  // ── Palette selector ──
  var DEFAULT_COLORS = ['#a9a29b','#9e5959','#5a7f50','#476e9c','#766473','#a47c81','#7f1712','#1a5143','#1f4786','#362344'];
  var _palettes = [];

  function buildPalDrop() {
    var collections = JSON.parse(localStorage.getItem('aim_collections') || '[]');
    _palettes = [
      { name: 'Studio Default', colors: DEFAULT_COLORS, gradient: 'linear-gradient(135deg,#a9a29b 0%,#476e9c 50%,#362344 100%)' },
      { name: 'Dusty Rose', colors: ['#aca299','#987f87','#a77b6f','#708e77','#6e8ba3'], gradient: 'linear-gradient(135deg,#aca299 0%,#987f87 25%,#a77b6f 50%,#708e77 75%,#6e8ba3 100%)' },
      { name: 'Pearl', colors: ['#aca18f','#9ca4a8','#423026'], gradient: 'linear-gradient(135deg,#aca18f 0%,#9ca4a8 50%,#423026 100%)' },
      { name: 'Illusions', colors: ['#a8a09b','#466e9b','#5a7e50','#a27f11'], gradient: 'linear-gradient(135deg,#a8a09b 0%,#466e9b 33%,#5a7e50 66%,#a27f11 100%)' }
    ].concat(collections.map(function(c) {
        return { name: c.name, colors: c.colours.map(function(col){ return col.hex; }), gradient: c.gradient };
      }));
    document.getElementById('pal-drop').innerHTML = _palettes.map(function(p, i) {
      return '<div class="pal-opt" onclick="selectPal('+i+')">' +
        '<div class="pal-opt-thumb" style="background:'+p.gradient+'"></div>' +
        '<span class="pal-opt-name">'+p.name+'</span>' +
        '</div>';
    }).join('');
  }

  function togglePalDrop() {
    var drop = document.getElementById('pal-drop');
    var open = drop.classList.toggle('open');
    document.getElementById('pal-chevron').style.transform = open ? 'rotate(180deg)' : '';
  }

  function selectPal(idx) {
    var p = _palettes[idx];
    document.getElementById('pal-name').textContent = p.name;
    var row1 = p.colors.slice(0,5), row2 = p.colors.slice(5,10);
    var phantom = '<div class="sw" style="background:transparent;pointer-events:none"></div>';
    var html = '<div class="row">' + row1.map(function(c){ return '<div class="sw" style="background:'+c+'" data-color="'+c+'"></div>'; }).join('') + '</div>';
    var row2Cells = row2.length ? row2.map(function(c){ return '<div class="sw" style="background:'+c+'" data-color="'+c+'"></div>'; }).join('') : Array(5).fill(phantom).join('');
    html += '<div class="row">' + row2Cells + '</div>';
    var sw2 = document.getElementById('swatches2');
    sw2.innerHTML = html;
    var first = sw2.querySelector('.sw');
    if (first) { first.classList.add('sel'); pendantColor = first.dataset.color; }
    document.getElementById('pal-drop').classList.remove('open');
    document.getElementById('pal-chevron').style.transform = '';
  }

  buildPalDrop();

  // Wire up SVG section tap-to-colour (no-op until #pendant-inline holds
  // an actual SVG with .cls-1 / .cls-3 / .cls-4 regions)
  ['cls-1','cls-3','cls-4'].forEach(function(cls) {
    document.querySelectorAll('#pendant-inline .'+cls).forEach(function(el) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var prev = sectionColors[cls] || origColors[cls];
        undoStack.push({cls: cls, prev: prev, next: pendantColor});
        redoStack = [];
        applySection(cls, pendantColor);
        updateUndoRedoState();
      });
    });
  });
</script>
</body>
</html>
