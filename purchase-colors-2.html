<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#151718;display:flex;justify-content:center;align-items:flex-start;padding:40px 20px;font-family:'Inter',sans-serif;min-height:100vh}

  .phone{width:393px;height:852px;background:#151718;border-radius:50px;overflow:hidden;box-shadow:0 0 0 1px #1a1a1a,0 24px 80px rgba(0,0,0,.9);display:flex;flex-direction:column;flex-shrink:0;position:relative}

  /* STATUS */
  .status{height:44px;position:relative;flex-shrink:0}

  /* HEADER */
  .header{height:44px;padding:0 22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;position:relative}
  .back-btn{position:absolute;left:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;display:flex;align-items:center;padding:0}
  .header-title{font-size:27px;font-weight:400;color:#fff;letter-spacing:.04em;text-transform:uppercase}

  /* PENDANT */
  .pendant-section{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 64px 0}
  .design-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:12px;align-self:flex-start}
  .pendant-section img{max-height:100%;max-width:100%;object-fit:contain}

  /* PALETTE SECTION */
  .palette-header{padding:18px 22px 0;flex-shrink:0}
  .palette-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:4px}

  /* Editorial scarcity tag */
  .palette-editorial{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:6px;}

  .missing-summary{font-size:12px;font-weight:400;color:#fff;letter-spacing:.08em;text-transform:uppercase}
  .missing-count{color:rgba(255,255,255,.55)}

  /* Collection progress — quiet, no bar */
  .collection-progress{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-top:5px;transition:color .4s ease}
  .collection-progress.updated{color:rgba(255,255,255,.55)}

  .divider{height:.5px;background:rgba(255,255,255,.1);margin:14px 22px 0;flex-shrink:0}

  /* COLOR ROWS */
  .color-list{padding:0 22px;flex-shrink:0}
  .color-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:.5px solid rgba(255,255,255,.07)}
  .color-row:last-child{border-bottom:none}

  .swatch{width:34px;height:34px;border-radius:3px;flex-shrink:0;transition:transform .4s cubic-bezier(0.34,1.56,0.64,1),box-shadow .4s ease}
  .swatch.just-added{animation:swatchReveal .45s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes swatchReveal{
    0%{transform:scale(.7);opacity:.3}
    100%{transform:scale(1);opacity:1}
  }

  .color-info{flex:1;min-width:0}
  .color-name{font-size:11px;font-weight:500;color:#fff;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
  .color-hex{font-size:9px;color:rgba(255,255,255,.3);letter-spacing:.08em}

  /* Owned state */
  .owned-tag{display:flex;align-items:center;gap:5px;flex-shrink:0}
  .owned-tag span{font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.3)}

  /* Unowned / add state */
  .unowned-action{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .price{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:.04em;transition:opacity .3s ease}

  .add-btn{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-family:'Inter',sans-serif;font-size:8px;letter-spacing:.2em;text-transform:uppercase;padding:5px 12px;border-radius:100px;cursor:pointer;transition:all .35s ease;white-space:nowrap;min-width:54px}
  .add-btn.added{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.4);letter-spacing:.14em}

  /* CTA */
  .cta-section{padding:16px 22px 22px;flex-shrink:0}
  .total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;padding:0 2px}
  .total-label{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.3)}
  .total-amount{font-size:15px;font-weight:400;color:#fff;letter-spacing:.04em;transition:opacity .2s ease}

  .cta-btn{width:100%;border:1.5px solid rgba(255,255,255,1);background:transparent;color:#fff;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.28em;text-transform:uppercase;padding:13px;border-radius:100px;text-align:center;cursor:pointer;transition:all .4s ease}
  .cta-btn.purchased{border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.4);letter-spacing:.2em}

  /* Toast notification */
  .toast{position:absolute;bottom:122px;left:22px;right:22px;background:rgba(30,30,30,.96);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:11px 16px;font-size:11px;color:rgba(255,255,255,.8);letter-spacing:.06em;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease;z-index:50}
  .toast.show{opacity:1;transform:translateY(0)}
  .toast-name{color:#fff;font-weight:500}

  /* TAB BAR */
  .tabs{height:72px;border-top:.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;flex-shrink:0}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  .tab-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
  .tab-ic svg{height:22px;width:22px}
  .tab-lbl{font-size:7px;letter-spacing:.18em;text-transform:uppercase;color:#fff;font-weight:500}

  /* HOME BAR */
  .home-bar{height:34px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .hb{width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.3)}
</style>
</head>
<body>
<div class="phone">

  <!-- STATUS BAR -->
  <div class="status">
    <img src="status-time.svg" alt="9:41" style="position:absolute;left:21px;top:12px;width:54px;height:21px;filter:brightness(0) invert(1)"/>
    <img src="status-icons.svg" alt="status icons" style="position:absolute;right:14.67px;top:17.33px;width:66.661px;height:11.336px;filter:brightness(0) invert(1)"/>
  </div>

  <!-- HEADER -->
  <div class="header">
    <button class="back-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"><path fill="white" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg>
    </button>
    <div class="header-title">Allie's Studio</div>
  </div>

  <!-- PENDANT -->
  <div class="pendant-section">
<img src="assets/ac-floral-pendant-with-loop.svg" alt="Floral pendant"/>
  </div>

  <!-- PALETTE HEADER -->
  <div class="palette-header">
    <div class="palette-editorial">Dusty Rose Palette</div>
    <div class="collection-progress" id="collection-progress">1 of 5 colors in your collection</div>
  </div>

  <div class="divider"></div>

  <!-- COLOR ROWS -->
  <div class="color-list">

    <!-- Owned -->
    <div class="color-row">
      <div class="swatch" style="background:#a9a29b"></div>
      <div class="color-info">
        <div class="color-name">Stone</div>
        <div class="color-hex">#a9a29b</div>
      </div>
      <div class="owned-tag"><svg width="11" height="11" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="rgba(255,255,255,.3)" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>In your collection</span>
      </div>
    </div>

    <!-- Not owned -->
    <div class="color-row" id="row-dusty-rose">
      <div class="swatch" id="swatch-dusty-rose" style="background:#a47c81"></div>
      <div class="color-info">
        <div class="color-name">Dusty Rose</div>
        <div class="color-hex">#a47c81</div>
      </div>
      <div class="unowned-action">
        <span class="price" id="price-dusty-rose">$2.99</span>
        <button class="add-btn" id="btn-dusty-rose" onclick="addColor('dusty-rose', 'Dusty Rose', 2.99)">Add</button>
      </div>
    </div>

    <!-- Not owned -->
    <div class="color-row" id="row-deep-plum">
      <div class="swatch" id="swatch-deep-plum" style="background:#362344"></div>
      <div class="color-info">
        <div class="color-name">Deep Plum</div>
        <div class="color-hex">#362344</div>
      </div>
      <div class="unowned-action">
        <span class="price" id="price-deep-plum">$2.99</span>
        <button class="add-btn" id="btn-deep-plum" onclick="addColor('deep-plum', 'Deep Plum', 2.99)">Add</button>
      </div>
    </div>

  </div>

  <!-- CTA -->
  <div class="cta-section">
    <div class="total-row">
      <span class="total-label">Total</span>
      <span class="total-amount" id="total-amount">$5.98</span>
    </div>
    <div class="cta-btn" id="cta-btn" onclick="purchase()">Purchase Missing Colors</div>
  </div>

  <!-- TAB BAR -->
  <div class="tabs">
    <div class="tab">
      <div class="tab-ic">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg>
      </div>
      <span class="tab-lbl">Closet</span>
    </div>
    <div class="tab">
      <div class="tab-ic">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" style="opacity:.5"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg>
      </div>
      <span class="tab-lbl" style="opacity:.5">Explore</span>
    </div>
    <div class="tab">
      <div class="tab-ic">
        <svg width="22" height="22" fill="none" style="transform:rotate(-30deg)">
          <ellipse cx="11" cy="11" rx="9" ry="6.5" stroke="white" stroke-width="1.3" opacity=".5"/>
          <ellipse cx="11" cy="11" rx="5.5" ry="4" stroke="white" stroke-width="1.3" opacity=".5"/>
          <ellipse cx="11" cy="11" rx="2" ry="1.5" stroke="white" stroke-width="1.3" opacity=".5"/>
        </svg>
      </div>
      <span class="tab-lbl" style="opacity:.5">Luminora</span>
    </div>
    <div class="tab">
      <div class="tab-ic">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg>
      </div>
      <span class="tab-lbl" style="opacity:.5">Profile</span>
    </div>
  </div>

  <div class="home-bar"><div class="hb"></div></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>

<script>
  const PALETTE_TOTAL = 5;
  const cart = {};
  let owned = 1; // Stone already owned

  function addColor(id, name, price) {
    const btn = document.getElementById('btn-' + id);
    const priceEl = document.getElementById('price-' + id);
    const swatch = document.getElementById('swatch-' + id);

    if (cart[id]) {
      // Toggle off
      delete cart[id];
      btn.textContent = 'Add';
      btn.classList.remove('added');
      priceEl.style.opacity = '1';
    } else {
      // Add to cart
      cart[id] = price;
      btn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="rgba(255,255,255,.3)" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> <span style="letter-spacing:.14em">Added</span>';
      btn.classList.add('added');
      priceEl.style.opacity = '0';

      // Swatch reveal animation
      swatch.classList.remove('just-added');
      void swatch.offsetWidth; // reflow to restart animation
      swatch.classList.add('just-added');

      // Named acquisition toast
      showToast('<span class="toast-name">' + name + '</span> added to your collection.');
    }

    updateTotal();
    updateProgress();
  }

  function updateTotal() {
    const total = Object.values(cart).reduce((s, v) => s + v, 0);
    const el = document.getElementById('total-amount');
    const ctaBtn = document.getElementById('cta-btn');

    el.style.opacity = '0.4';
    setTimeout(() => {
      el.textContent = total > 0 ? '$' + total.toFixed(2) : '$0.00';
      el.style.opacity = '1';
    }, 150);

    // Dim CTA if nothing selected
    ctaBtn.style.opacity = total > 0 ? '1' : '0.4';
  }

  function updateProgress() {
    const added = Object.keys(cart).length;
    const total = owned + added;
    const el = document.getElementById('collection-progress');
    el.textContent = total + ' of ' + PALETTE_TOTAL + ' colors in your collection';
    el.classList.add('updated');
    setTimeout(() => el.classList.remove('updated'), 1200);
  }

  function purchase() {
    if (Object.keys(cart).length === 0) return;
    const btn = document.getElementById('cta-btn');
    btn.textContent = 'Adding to your collection…';
    btn.style.opacity = '0.5';
    setTimeout(() => {
      btn.textContent = 'Collection updated';
      btn.classList.add('purchased');

      // Mark all cart items as owned
      Object.keys(cart).forEach(id => {
        const addBtn = document.getElementById('btn-' + id);
        const priceEl = document.getElementById('price-' + id);
        const action = addBtn.closest('.unowned-action');
        action.innerHTML = '<div class="owned-tag"><svg width="11" height="11" viewBox="0 0 24 24" style="flex-shrink:0"><path fill="rgba(255,255,255,.3)" d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>In your collection</span></div>';
        owned++;
      });

      Object.keys(cart).forEach(k => delete cart[k]);
      updateTotal();
      document.getElementById('collection-progress').textContent = owned + ' of ' + PALETTE_TOTAL + ' colors in your collection';
      showToast('Your collection has been updated.');
    }, 900);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerHTML = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
