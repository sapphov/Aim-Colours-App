<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, initial-scale=1.0" />
  <title>Aim Colours — Pendants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f0ede8; }

    .phone { background: #fff; display: flex; flex-direction: column; }

    /* Status bar */
    .status-bar { background: #fff; }

    /* Header */
    .pendants-header {
      display: flex; align-items: center;
      padding: 8px 10px 10px;
      background: #fff;
      flex-shrink: 0;
    }
    .pendants-back {
      display: flex; align-items: center; flex-shrink: 0;
      text-decoration: none;
    }
    .pendants-title {
      font-family: 'Inter', sans-serif;
      font-size: 28px; font-weight: 400;
      color: #000; letter-spacing: -0.02em;
      flex: 1; padding-left: 8px;
    }
    .pendants-palette {
      width: 32px; height: 32px; flex-shrink: 0;
    }
    .pendants-palette img { width: 100%; height: 100%; object-fit: contain; }

    /* Scrollable content */
    .pendants-content {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      background: #fff;
      scrollbar-width: none;
    }
    .pendants-content::-webkit-scrollbar { display: none; }

    /* Divider */
    .pendants-divider {
      height: 0.5px;
      background: rgba(0,0,0,0.12);
      margin: 0 10px;
    }

    /* Section */
    .pendant-section { padding-bottom: 4px; }
    .pendant-section-label {
      font-family: 'Inter', sans-serif;
      font-size: 18px; font-weight: 400;
      color: #000; letter-spacing: -0.02em;
      padding: 6px 10px 10px;
    }

    /* Scroll row */
    .pendant-scroll-wrap {
      position: relative;
      padding-bottom: 24px;
    }
    .pendant-row {
      display: flex;
      gap: 25px;
      align-items: center;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      padding: 0 10px 0;
    }
    .pendant-row::-webkit-scrollbar { display: none; }

    /* Pendant card */
    .pendant-item {
      flex-shrink: 0;
      width: 150px; height: 160px;
      background: #0d0d0d;
      border-radius: 10px;
      overflow: hidden;
      display: flex; flex-direction: column;
      cursor: pointer;
      padding: 8px 8px;
    }
    .pendant-item-name {
      font-family: 'Inter', sans-serif;
      font-size: 8px; font-weight: 500;
      letter-spacing: .14em; text-transform: uppercase;
      color: rgba(255,255,255,.45);
      text-align: center;
    }
    .pendant-item-image {
      flex: 1; min-height: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .pendant-item-image img {
      width: 70%; height: 70%;
      object-fit: contain;
    }
    .pendant-item-hexes {
      display: flex; gap: 5px; flex-wrap: wrap;
      justify-content: center;
    }
    .hex-chip {
      font-family: 'Inter', sans-serif;
      font-size: 7px; letter-spacing: .02em;
      color: rgba(255,255,255,.85);
      background: rgba(255,255,255,.08);
      padding: 2px 5px; border-radius: 4px;
    }
    /* Cards without a full recolorable template (Dusty Rose Reserve) stay plain */
    #row-dustyrose .pendant-item {
      background: #f7f6f4;
      flex-direction: row; align-items: center; justify-content: center;
      padding: 0;
    }
    #row-dustyrose .pendant-item img {
      width: 90%; height: 90%;
      object-fit: contain;
    }

    /* Scroll indicator */
    .pendant-track {
      position: absolute; bottom: 6px; left: 10px; right: 10px;
      height: 1.5px; background: rgba(0,0,0,0.12); border-radius: 1px;
    }
    .pendant-thumb {
      position: absolute; bottom: 6px; left: 10px;
      height: 1.5px; width: 60px;
      background: #000; border-radius: 1px;
      transition: left 0.1s;
    }

    /* Tab bar — match screen-closet.html */
    .tabs { background:#0d0d0d; height:72px; border-top:.5px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:space-evenly; padding:0 8px; flex-shrink:0; }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; }
    .tab-ic { width:24px; height:24px; opacity:1; display:flex; align-items:center; justify-content:center; }
    .tab-ic svg { height:22px; width:22px; }
    .tab-lbl { font-size:7px; letter-spacing:.18em; text-transform:uppercase; color:#fff; font-weight:500; }
    .home-bar { background:#0d0d0d; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hb { width:134px; height:5px; border-radius:3px; background:rgba(255,255,255,.3); }
  </style>
</head>

<script>
  // SVG files and the fill colours in each that we'll replace.
  // #35201f (the dark outline/stroke) is intentionally left alone
  // so the line-art definition is always preserved.
  const SVG_FILLS = {
    'assets/ac-floral-pendant.svg':      ['#bd97c6', '#84424c', '#deb5b9'],
    'assets/ac-flower-girl-pendant.svg': ['#deb5b9', '#84424c', '#bd97c6', '#fdbdde', '#fd6f77'],
    'assets/ac-twirl-pendant.svg':       ['#bd97c6', '#84424c', '#deb5b9'],
  };

  // Curated colour combinations pulled from the closet — one set per row,
  // in display order, replacing the old random colour generator.
  const ROW_DESIGNS = {
    'row-archive': [
      { name: 'Mist, Plum & Sage',        svg: 'assets/ac-floral-pendant.svg',      colors: ['#9ca4a8', '#4c293c', '#708e77'] },
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#987f87', '#5b4c66', '#a97a73', '#6e8ba3', '#aca299'] },
      { name: 'Floral',                   svg: 'assets/ac-floral-pendant.svg',      colors: ['#9ca4a8', '#423026', '#aca18f'] },
      { name: 'Slate',                    svg: 'assets/ac-floral-pendant.svg',      colors: ['#6e8ba3', '#6e8ba3', '#6e8ba3'] },
      { name: 'Mist & Sakura',            svg: 'assets/ac-floral-pendant.svg',      colors: ['#9ca4a8', '#a47c81', '#a47c81'] },
      { name: 'Sakura, Emerald & Mist',   svg: 'assets/ac-floral-pendant.svg',      colors: ['#a47c81', '#195044', '#9ca4a8'] },
    ],
    'row-friends': [
      { name: 'Plum & Sandstone',         svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#a8a09b', '#a8a09b', '#a8a09b', '#a8a09b', '#4c293c'] },
      { name: 'Floral',                   svg: 'assets/ac-floral-pendant.svg',      colors: ['#6e8ba3', '#2a2850', '#7b6371'] },
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#aca18f', '#423026', '#aca18f', '#9ca4a8', '#8d828a'] },
      { name: 'Floral',                   svg: 'assets/ac-floral-pendant.svg',      colors: ['#a97a73', '#391e3b', '#69485d'] },
      { name: 'Twirl',                    svg: 'assets/ac-twirl-pendant.svg',       colors: ['#69485d', '#a97a73', '#391e3b'] },
      { name: 'Plum',                     svg: 'assets/ac-floral-pendant.svg',      colors: ['#4c293c', '#4c293c', '#4c293c'] },
    ],
    'row-recent': [
      { name: 'Twirl',                    svg: 'assets/ac-twirl-pendant.svg',       colors: ['#aca299', '#9ca68e', '#5a6a87'] },
      { name: 'Heather & Walnut',         svg: 'assets/heather-walnut.svg',         colors: ['#8d828a', '#423026'], static: true },
      { name: 'Twirl',                    svg: 'assets/ac-twirl-pendant.svg',       colors: ['#726576', '#aaa3a2', '#4c293c'] },
      { name: 'Sage',                     svg: 'assets/ac-floral-pendant.svg',      colors: ['#708d81', '#708d81', '#708d81'] },
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#aba09f', '#123744', '#708d81', '#9ca699', '#a47c81'] },
      { name: 'Sakura & Midnight',        svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#2a2850', '#2a2850', '#2a2850', '#2a2850', '#a47c81'] },
    ],
  };

  // Dusty Rose Reserve — already fully coloured, one-off designs pulled
  // from the Dusty Rose collection (see designs-dusty-rose.html), so they
  // load straight from assets/ with no fill-replacement needed.
  const DUSTY_ROSE_DESIGNS = [
    { name: 'Floral Emblem',    svg: 'assets/dusty-rose-floral-emblem.svg' },
    { name: 'Flower Girl',      svg: 'assets/dusty-rose-flower-girl.svg' },
    { name: 'Rose Bloom',       svg: 'assets/dusty-rose-rose-bloom.svg' },
    { name: 'Twirl',            svg: 'assets/dusty-rose-twirl.svg' },
    { name: 'Azure Silhouette', svg: 'assets/dusty-rose-azure-silhouette.svg' },
    { name: 'Dusty Bloom',      svg: 'assets/dusty-rose-dusty-bloom.svg' },
    { name: 'Rose Wood Emblem', svg: 'assets/dusty-rose-rose-wood-emblem.svg' },
    { name: 'Stone',            svg: 'assets/dusty-rose-stone.svg' },
    { name: 'Dusty Rose',       svg: 'assets/dusty-rose-dusty-rose.svg' },
    { name: 'Rose Wood',        svg: 'assets/dusty-rose-rose-wood.svg' },
    { name: 'Sage',             svg: 'assets/dusty-rose-sage.svg' },
    { name: 'Azure Haze',       svg: 'assets/dusty-rose-azure-haze.svg' },
  ];

  // SVG source is embedded above (fetch() of local files is blocked
  // under file://, since this app runs without a server).
  const SVG_ELEMENT_IDS = {
    'assets/ac-floral-pendant.svg':      'svg-src-floral',
    'assets/ac-flower-girl-pendant.svg': 'svg-src-flower-girl',
    'assets/ac-twirl-pendant.svg':       'svg-src-twirl',
  };
  async function fetchSVG(url) {
    return document.getElementById(SVG_ELEMENT_IDS[url]).textContent;
  }

  // Build one pendant: chosen SVG + chosen colour mapping → blob URL → <img>
  // (design.static designs are already fully coloured — just load them
  // directly, skipping the fetch/recolour pipeline.)
  async function fillSlot(slot, design) {
    let imgSrc;
    if (design.static) {
      imgSrc = design.svg;
    } else {
      const fills = SVG_FILLS[design.svg];
      let text = await fetchSVG(design.svg);
      fills.forEach((original, i) => {
        // Replace every occurrence (split/join avoids regex escaping issues)
        text = text.split(original).join(design.colors[i]);
      });

      // Solid designs (every fill the same colour) should read as a clean
      // silhouette, so also hide the dark detail-line stroke into the fill.
      if (design.colors.every(c => c === design.colors[0])) {
        text = text.split('#35201f').join(design.colors[0]);
      }

      const blob = new Blob([text], { type: 'image/svg+xml' });
      imgSrc = URL.createObjectURL(blob);
    }

    const name = document.createElement('div');
    name.className = 'pendant-item-name';
    name.textContent = design.name;

    const imgWrap = document.createElement('div');
    imgWrap.className = 'pendant-item-image';
    const img = document.createElement('img');
    img.src = imgSrc;
    img.alt = 'pendant';
    imgWrap.appendChild(img);

    const hexes = document.createElement('div');
    hexes.className = 'pendant-item-hexes';
    // De-dupe repeated colours (e.g. solids, or two roles sharing a hue)
    // so chips match the number of genuinely distinct colours in the design.
    [...new Set(design.colors)].forEach(function(hex) {
      const chip = document.createElement('div');
      chip.className = 'hex-chip';
      chip.textContent = hex;
      hexes.appendChild(chip);
    });

    slot.appendChild(name);
    slot.appendChild(imgWrap);
    slot.appendChild(hexes);
  }

  // Dusty Rose Reserve designs are static, pre-coloured files — just drop
  // them straight in, no fetch/recolour pipeline needed.
  function fillStaticSlot(slot, design) {
    const img = document.createElement('img');
    img.src   = design.svg;
    img.alt   = 'pendant';
    slot.appendChild(img);
  }

  // ── Init ────────────────────────────────────────────────────
  async function init() {
    const fillJobs = [];
    Object.keys(ROW_DESIGNS).forEach(function(rowId) {
      const rowEl = document.getElementById(rowId);
      if (!rowEl) return;
      const slots   = rowEl.querySelectorAll('.pendant-item');
      const designs = ROW_DESIGNS[rowId];
      slots.forEach(function(slot, i) {
        const design = designs[i];
        slot.addEventListener('click', function() {
          // The Studio only knows how to render the Floral shape today, so
          // only Floral cards can hand their exact colours over to it.
          if (design && design.svg === 'assets/ac-floral-pendant.svg') {
            const [bg, flower, tendril] = design.colors;
            const params = new URLSearchParams({ studio: '1', nosplash: '1', c1: bg, c3: flower, c4: tendril });
            window.location.href = 'screen-closet.html?' + params.toString();
          } else {
            window.location.href = 'screen-closet.html?studio=1&nosplash=1';
          }
        });
        if (design) fillJobs.push(fillSlot(slot, design));
      });
    });

    const dustyRoseRow = document.getElementById('row-dustyrose');
    if (dustyRoseRow) {
      const slots = dustyRoseRow.querySelectorAll('.pendant-item');
      slots.forEach(function(slot, i) {
        const design = DUSTY_ROSE_DESIGNS[i];
        if (!design) return;
        slot.addEventListener('click', function() {
          // Dusty Rose designs use their own shapes/fill structure, not
          // wired up to the Studio's colour hand-off — open its default.
          window.location.href = 'screen-closet.html?studio=1&nosplash=1';
        });
        fillStaticSlot(slot, design);
      });
    }

    await Promise.all(fillJobs);
  }
  init();

  // ── Scroll thumb animation ──────────────────────────────────
  const rows = [
    { row: 'row-archive',   thumb: 'thumb-archive'   },
    { row: 'row-friends',   thumb: 'thumb-friends'   },
    { row: 'row-recent',    thumb: 'thumb-recent'    },
    { row: 'row-dustyrose', thumb: 'thumb-dustyrose' },
  ];
  rows.forEach(({ row, thumb }) => {
    const rowEl   = document.getElementById(row);
    const thumbEl = document.getElementById(thumb);
    if (!rowEl || !thumbEl) return;
    rowEl.addEventListener('scroll', () => {
      const scrollMax = rowEl.scrollWidth - rowEl.clientWidth;
      const ratio     = scrollMax > 0 ? rowEl.scrollLeft / scrollMax : 0;
      const trackWidth = rowEl.parentElement.querySelector('.pendant-track').offsetWidth;
      const thumbWidth = 60;
      thumbEl.style.left = (10 + ratio * (trackWidth - thumbWidth)) + 'px';
    });
  });
</script>
