<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, initial-scale=1.0" />
  <title>Aim Colours — Pendants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f0ede8; }

    .phone { background: #fff; display: flex; flex-direction: column; }

    /* Status bar */
    .status-bar { background: #fff; }

    /* Header */
    .pendants-header {
      display: flex; align-items: center;
      padding: 8px 10px 10px;
      background: #fff;
      flex-shrink: 0;
    }
    .pendants-back {
      display: flex; align-items: center; flex-shrink: 0;
      text-decoration: none;
    }
    .pendants-title {
      font-family: 'Inter', sans-serif;
      font-size: 28px; font-weight: 400;
      color: #000; letter-spacing: -0.02em;
      flex: 1; padding-left: 8px;
    }
    .pendants-palette {
      width: 32px; height: 32px; flex-shrink: 0;
    }
    .pendants-palette img { width: 100%; height: 100%; object-fit: contain; }

    /* Scrollable content */
    .pendants-content {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      background: #fff;
      scrollbar-width: none;
    }
    .pendants-content::-webkit-scrollbar { display: none; }

    /* Divider */
    .pendants-divider {
      height: 0.5px;
      background: rgba(0,0,0,0.12);
      margin: 0 10px;
    }

    /* Section */
    .pendant-section { padding-bottom: 4px; }
    .pendant-section-label {
      font-family: 'Inter', sans-serif;
      font-size: 18px; font-weight: 400;
      color: #000; letter-spacing: -0.02em;
      padding: 6px 10px 10px;
    }

    /* Scroll row */
    .pendant-scroll-wrap {
      position: relative;
      padding-bottom: 24px;
    }
    .pendant-row {
      display: flex;
      gap: 16px;
      align-items: center;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      padding: 0 10px 0;
    }
    .pendant-row::-webkit-scrollbar { display: none; }

    /* Pendant card */
    .pendant-item {
      flex-shrink: 0;
      width: 250px; height: 160px;
      background: #f7f6f4;
      border-radius: 10px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .pendant-item img {
      width: 90%; height: 90%;
      object-fit: contain;
    }

    /* Scroll indicator */
    .pendant-track {
      position: absolute; bottom: 6px; left: 10px; right: 10px;
      height: 1.5px; background: rgba(0,0,0,0.12); border-radius: 1px;
    }
    .pendant-thumb {
      position: absolute; bottom: 6px; left: 10px;
      height: 1.5px; width: 60px;
      background: #000; border-radius: 1px;
      transition: left 0.1s;
    }

    /* Tab bar — match screen-closet.html */
    .tabs { background:#0d0d0d; height:72px; border-top:.5px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:space-evenly; padding:0 8px; flex-shrink:0; }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; }
    .tab-ic { width:24px; height:24px; opacity:1; display:flex; align-items:center; justify-content:center; }
    .tab-ic svg { height:22px; width:22px; }
    .tab-lbl { font-size:7px; letter-spacing:.18em; text-transform:uppercase; color:#fff; font-weight:500; }
    .home-bar { background:#0d0d0d; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hb { width:134px; height:5px; border-radius:3px; background:rgba(255,255,255,.3); }
  </style>
</head>
<body>
<div class="phone">

  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time" style="color:#000">9:41</span>
    <div class="status-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="black">
        <rect x="0" y="6" width="3" height="6" rx="0.5" opacity="0.3"/>
        <rect x="4.5" y="4" width="3" height="8" rx="0.5" opacity="0.5"/>
        <rect x="9" y="2" width="3" height="10" rx="0.5" opacity="0.7"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12">
        <path d="M8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="black"/>
        <path d="M4.9 7.4a4.4 4.4 0 0 1 6.2 0" stroke="black" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <path d="M2.4 5a7.2 7.2 0 0 1 11.2 0" stroke="black" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/>
      </svg>
      <svg width="25" height="12" viewBox="0 0 25 12">
        <rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="black" stroke-width="1" fill="none" opacity="0.35"/>
        <rect x="2" y="2" width="17" height="8" rx="1.5" fill="black"/>
        <path d="M22.5 4v4a2 2 0 0 0 0-4z" fill="black" opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- Header -->
  <div class="pendants-header">
    <a class="pendants-back" href="screen-closet.html?nosplash=1">
      <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"><path fill="black" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg>
    </a>
    <div class="pendants-title">Pendants</div>
  </div>
  <div class="pendants-divider"></div>

  <!-- Content -->
  <div class="pendants-content">

    <!-- Archive -->
    <div class="pendant-section">
      <div class="pendant-section-label" style="padding-top: 16px">Archive</div>
      <div class="pendant-scroll-wrap">
        <div class="pendant-row" id="row-archive">
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
        </div>
        <div class="pendant-track"></div>
        <div class="pendant-thumb" id="thumb-archive"></div>
      </div>
    </div>

    <!-- Created by Friends -->
    <div class="pendant-section">
      <div class="pendant-section-label">Created by Friends</div>
      <div class="pendant-scroll-wrap">
        <div class="pendant-row" id="row-friends">
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
        </div>
        <div class="pendant-track"></div>
        <div class="pendant-thumb" id="thumb-friends"></div>
      </div>
    </div>

    <!-- Recently Worn -->
    <div class="pendant-section">
      <div class="pendant-section-label">Recently Worn</div>
      <div class="pendant-scroll-wrap">
        <div class="pendant-row" id="row-recent">
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
          <div class="pendant-item"></div>
        </div>
        <div class="pendant-track"></div>
        <div class="pendant-thumb" id="thumb-recent"></div>
      </div>
    </div>

  </div>

  <!-- Tab Bar -->
  <div class="tabs">
    <a class="tab" href="screen-closet.html" style="text-decoration:none">
      <div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg></div>
      <span class="tab-lbl">Closet</span>
    </a>
    <a class="tab" href="screen-explore.html" style="text-decoration:none">
      <div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" style="opacity:.5"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg></div>
      <span class="tab-lbl" style="opacity:.5">Explore</span>
    </a>
    <a class="tab" href="Index.html" style="text-decoration:none">
      <div class="tab-ic"><svg width="22" height="22" fill="none" style="transform:rotate(-30deg)"><ellipse cx="11" cy="11" rx="9" ry="6.5" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="5.5" ry="4" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="2" ry="1.5" stroke="white" stroke-width="1.3" opacity=".5"/></svg></div>
      <span class="tab-lbl" style="opacity:.5">Luminora</span>
    </a>
    <a class="tab" href="screen-profile.html" style="text-decoration:none">
      <div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg></div>
      <span class="tab-lbl" style="opacity:.5">Profile</span>
    </a>
  </div>
  <div class="home-bar"><div class="hb"></div></div>

</div>

<script>
  // SVG files and the fill colours in each that we'll replace.
  // #35201f (the dark outline/stroke) is intentionally left alone
  // so the line-art definition is always preserved.
  const SVG_FILLS = {
    'assets/ac-floral-pendant.svg':      ['#bd97c6', '#84424c', '#deb5b9'],
    'assets/ac-flower-girl-pendant.svg': ['#deb5b9', '#84424c', '#bd97c6', '#fdbdde', '#fd6f77'],
    'assets/ac-twirl-pendant.svg':       ['#bd97c6', '#84424c', '#deb5b9'],
  };

  // Curated colour combinations pulled from the closet — one set per row,
  // in display order, replacing the old random colour generator.
  const ROW_DESIGNS = {
    'row-archive': [
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#987f87', '#5b4c66', '#a97a73', '#6e8ba3', '#aca299'] },
      { name: 'Floral',                   svg: 'assets/ac-floral-pendant.svg',      colors: ['#9ca4a8', '#423026', '#aca18f'] },
      { name: 'Sakura, Emerald & Mist',   svg: 'assets/ac-floral-pendant.svg',      colors: ['#a47c81', '#195044', '#9ca4a8'] },
      { name: 'Twirl',                    svg: 'assets/ac-twirl-pendant.svg',       colors: ['#aca299', '#9ca68e', '#5a6a87'] },
      { name: 'Slate',                    svg: 'assets/ac-floral-pendant.svg',      colors: ['#6e8ba3', '#6e8ba3', '#6e8ba3'] },
    ],
    'row-friends': [
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#aca18f', '#423026', '#aca18f', '#9ca4a8', '#8d828a'] },
      { name: 'Floral',                   svg: 'assets/ac-floral-pendant.svg',      colors: ['#6e8ba3', '#2a2850', '#7b6371'] },
      { name: 'Floral',                   svg: 'assets/ac-floral-pendant.svg',      colors: ['#a97a73', '#391e3b', '#69485d'] },
      { name: 'Twirl',                    svg: 'assets/ac-twirl-pendant.svg',       colors: ['#69485d', '#a97a73', '#391e3b'] },
      { name: 'Plum',                     svg: 'assets/ac-floral-pendant.svg',      colors: ['#4c293c', '#4c293c', '#4c293c'] },
    ],
    'row-recent': [
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#aba09f', '#123744', '#708d81', '#9ca699', '#a47c81'] },
      { name: 'Twirl',                    svg: 'assets/ac-twirl-pendant.svg',       colors: ['#726576', '#aaa3a2', '#4c293c'] },
      { name: 'Sage',                     svg: 'assets/ac-floral-pendant.svg',      colors: ['#708d81', '#708d81', '#708d81'] },
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#987f87', '#a77b6f', '#9ba5a9', '#aba09f', '#5a6a87'] },
      { name: 'Flower Girl',              svg: 'assets/ac-flower-girl-pendant.svg', colors: ['#996068', '#2c5a39', '#aba09f', '#726a7c', '#9ca699'] },
    ],
  };

  // Cache fetched SVG text so we only download each file once
  const svgCache = {};
  async function fetchSVG(url) {
    if (!svgCache[url]) {
      const res = await fetch(url);
      svgCache[url] = await res.text();
    }
    return svgCache[url];
  }

  // Build one pendant: chosen SVG + chosen colour mapping → blob URL → <img>
  async function fillSlot(slot, design) {
    const fills = SVG_FILLS[design.svg];

    let text = await fetchSVG(design.svg);
    fills.forEach((original, i) => {
      // Replace every occurrence (split/join avoids regex escaping issues)
      text = text.split(original).join(design.colors[i]);
    });

    // Solid designs (every fill the same colour) should read as a clean
    // silhouette, so also hide the dark detail-line stroke into the fill.
    if (design.colors.every(c => c === design.colors[0])) {
      text = text.split('#35201f').join(design.colors[0]);
    }

    const blob   = new Blob([text], { type: 'image/svg+xml' });
    const objURL = URL.createObjectURL(blob);

    const img = document.createElement('img');
    img.src   = objURL;
    img.alt   = 'pendant';
    slot.appendChild(img);
  }

  // ── Init ────────────────────────────────────────────────────
  async function init() {
    const fillJobs = [];
    Object.keys(ROW_DESIGNS).forEach(function(rowId) {
      const rowEl = document.getElementById(rowId);
      if (!rowEl) return;
      const slots   = rowEl.querySelectorAll('.pendant-item');
      const designs = ROW_DESIGNS[rowId];
      slots.forEach(function(slot, i) {
        slot.addEventListener('click', function() {
          window.location.href = 'screen-closet.html?studio=1';
        });
        if (designs[i]) fillJobs.push(fillSlot(slot, designs[i]));
      });
    });
    await Promise.all(fillJobs);
  }
  init();

  // ── Scroll thumb animation ──────────────────────────────────
  const rows = [
    { row: 'row-archive', thumb: 'thumb-archive' },
    { row: 'row-friends', thumb: 'thumb-friends' },
    { row: 'row-recent',  thumb: 'thumb-recent'  },
  ];
  rows.forEach(({ row, thumb }) => {
    const rowEl   = document.getElementById(row);
    const thumbEl = document.getElementById(thumb);
    if (!rowEl || !thumbEl) return;
    rowEl.addEventListener('scroll', () => {
      const scrollMax = rowEl.scrollWidth - rowEl.clientWidth;
      const ratio     = scrollMax > 0 ? rowEl.scrollLeft / scrollMax : 0;
      const trackWidth = rowEl.parentElement.querySelector('.pendant-track').offsetWidth;
      const thumbWidth = 60;
      thumbEl.style.left = (10 + ratio * (trackWidth - thumbWidth)) + 'px';
    });
  });
</script>
</body>
</html>
