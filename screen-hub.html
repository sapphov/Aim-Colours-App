<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aim Colours — Screen Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { text-decoration: none; color: inherit; }

    body {
      background: #05020a;
      min-height: 100vh;
      font-family: 'Inter', Helvetica, Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px 80px;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(123,82,200,0.13) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .hub-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 540px;
    }

    .hub-eyebrow {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 8px;
    }
    .hub-title {
      font-family: 'Inter', Helvetica, Arial, sans-serif;
      font-size: 27px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      margin-bottom: 6px;
      text-align: center;
    }
    .hub-sub {
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 52px;
    }

    /* 2×2 Grid */
    .hub-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      width: 100%;
    }

    /* Card */
    .hub-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 26px 24px;
      border-radius: 20px;
      border: 0.5px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      aspect-ratio: 1 / 1.05;
      overflow: hidden;
      transition: border-color 0.25s, transform 0.2s, background 0.25s;
      cursor: pointer;
    }
    .hub-card:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.22);
      transform: translateY(-3px);
    }
    .hub-card:hover .card-arrow { opacity: 1; transform: translate(3px, -3px); }

    /* Per-screen accent glow on hover */
    .hub-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: inherit;
    }
    .hub-card:hover::before { opacity: 1; }
    .card-explore::before  { background: radial-gradient(ellipse at 80% 20%, rgba(123,82,200,0.18) 0%, transparent 65%); }
    .card-studio::before   { background: radial-gradient(ellipse at 20% 20%, rgba(160,125,224,0.15) 0%, transparent 65%); }
    .card-luminora::before { background: radial-gradient(ellipse at 50% 10%, rgba(123,82,200,0.22) 0%, transparent 65%); }
    .card-profile::before  { background: radial-gradient(ellipse at 80% 20%, rgba(200,192,184,0.12) 0%, transparent 65%); }
    .card-boutique::before { background: radial-gradient(ellipse at 20% 20%, rgba(200,168,82,0.16) 0%, transparent 65%); }

    /* Boutique card spans full width beneath the 2x2 grid */
    .hub-card.card-boutique {
      width: 100%;
      margin-top: 14px;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      aspect-ratio: auto;
      padding: 22px 26px;
    }
    .card-boutique .card-icon-wrap { position: static; margin-right: 16px; }
    .card-boutique .card-text { display: flex; flex-direction: column; }
    .card-boutique .card-arrow { position: static; margin-left: auto; }

    /* Icon */
    .card-icon-wrap {
      position: absolute;
      top: 26px;
      left: 24px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      border: 0.5px solid rgba(255,255,255,0.1);
    }
    .card-icon-wrap svg { opacity: 0.7; }

    /* Text */
    .card-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      margin-bottom: 6px;
    }
    .card-name {
      font-family: 'Inter', Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.1;
    }

    /* Arrow */
    .card-arrow {
      position: absolute;
      top: 24px;
      right: 22px;
      font-size: 18px;
      color: rgba(255,255,255,0.25);
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
    }

    .hub-footer {
      margin-top: 48px;
      font-size: 10px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

<div class="hub-wrap">

  <div class="hub-eyebrow">Aim Colours</div>
  <h1 class="hub-title">Aim Colours App</h1>
  <p class="hub-sub">Screen Hub</p>

  <div class="hub-grid">

    <!-- Explore -->
    <a class="hub-card card-explore" href="screen-explore.html">
      <div class="card-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg>
      </div>
      <div class="card-arrow">↗</div>
      <div class="card-label">Tab</div>
      <div class="card-name">Explore</div>
    </a>

    <!-- Studio -->
    <a class="hub-card card-studio" href="studio-02.html">
      <div class="card-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg>
      </div>
      <div class="card-arrow">↗</div>
      <div class="card-label">Closet</div>
      <div class="card-name">Studio</div>
    </a>

    <!-- Luminora -->
    <a class="hub-card card-luminora" href="index.html">
      <div class="card-icon-wrap">
        <svg width="20" height="20" fill="none" style="transform:rotate(-30deg)">
          <ellipse cx="10" cy="10" rx="8.5" ry="6" stroke="white" stroke-width="1.3"/>
          <ellipse cx="10" cy="10" rx="5" ry="3.5" stroke="white" stroke-width="1.3"/>
          <ellipse cx="10" cy="10" rx="1.8" ry="1.3" stroke="white" stroke-width="1.3"/>
        </svg>
      </div>
      <div class="card-arrow">↗</div>
      <div class="card-label">Home</div>
      <div class="card-name">Luminora</div>
    </a>

    <!-- Profile -->
    <a class="hub-card card-profile" href="screen-profile.html">
      <div class="card-icon-wrap">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg>
      </div>
      <div class="card-arrow">↗</div>
      <div class="card-label">Tab</div>
      <div class="card-name">Profile</div>
    </a>

  </div>

  <!-- Boutique -->
  <a class="hub-card card-boutique" href="explore-findcolour.html">
    <div class="card-icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M4 4h16l1.5 5H2.5L4 4z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M3 10h18v10H3z" stroke="white" stroke-width="1.3" stroke-linejoin="round"/>
        <path d="M7 10v10M17 10v3a3 3 0 0 1-6 0v-3" stroke="white" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="card-text">
      <div class="card-label">Closet</div>
      <div class="card-name">Boutique</div>
    </div>
    <div class="card-arrow">↗</div>
  </a>

  <div class="hub-footer">Aim Colours — 2026</div>

</div>

</body>
</html>
