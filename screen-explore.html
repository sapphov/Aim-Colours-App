<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, initial-scale=1.0" />
  <title>Luminora — Explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Black background ───────────────────────────────────── */
    .bg { background: #151718; }
    .light-beam, .ground-glow, .vignette { display: none; }

    /* ── studio-02 tab bar ───────────────────────────────────── */
    .tab-bar { background: #151718; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .tabs { height: 72px; border-top: none; display: flex; align-items: center; justify-content: space-evenly; padding: 0 8px; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; }
    .tab-ic { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .tab-ic svg { height: 22px; width: 22px; }
    .tab-lbl { font-size: 7px; letter-spacing: .18em; text-transform: uppercase; color: #fff; font-weight: 500; }
    .home-bar { height: 34px; display: flex; align-items: center; justify-content: center; }
    .hb { width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); }

    /* ── Pinned search bar (always visible, never scrolls) ─── */
    .exp-search-pinned {
      position: absolute;
      top: 48px; left: 0; right: 0;
      background: #151718;
      z-index: 10;
    }

    /* ── Explore scrollable content ─────────────────────────── */
    .explore-content {
      position: absolute;
      top: 121px; bottom: 106px; left: 0; right: 0;
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: none;
      z-index: 5;
      display: flex; flex-direction: column;
    }
    .explore-content::-webkit-scrollbar { display: none; }

    /* Search bar */
    .exp-search {
      display: flex; align-items: center; gap: 10px;
      margin: 14px 18px 0;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      padding: 11px 14px;
      background: rgba(255,255,255,0.04);
    }
    .exp-search-placeholder {
      font-family: 'Inter', sans-serif;
      font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
    }

    .exp-divider {
      height: 0.5px;
      background: rgba(255,255,255,0.15);
      margin: 18px 0 0;
    }

    /* Section headings */
    .exp-section-head {
      padding: 16px 18px 10px;
    }
    .featured-sticky .exp-section-head {
      padding-top: 0;
      padding-bottom: 0;
    }
    .exp-section-title {
      font-family: 'Inter', sans-serif;
      font-size: 27px; font-weight: 400;
      letter-spacing: .04em; text-transform: uppercase;
      color: #fff; line-height: 1.2;
    }

    /* ── Featured (pinned, shrinks on scroll) ──────────────────── */
    .featured-sticky {
      position: sticky; top: 0; z-index: 6;
      background: #151718;
      padding-top: 18px;
      flex-shrink: 0;
    }

    /* ── Feature cards ───────────────────────────────────────── */
    .exp-cards-scroll {
      display: flex; gap: 10px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      padding: 8px 18px 0;
      position: relative; z-index: 2;
      background: #151718;
    }
    .exp-cards-scroll::-webkit-scrollbar { display: none; }

    .exp-card {
      flex-shrink: 0;
      width: 230px;
      display: flex; flex-direction: column;
    }
    .exp-card-img {
      width: 230px; height: 290px;
      border-radius: 2px;
      position: relative; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
      transition: height 0.15s ease-out;
    }
    .exp-card-badge {
      position: absolute; top: 12px; left: 12px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 8px; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: #000; padding: 5px 9px;
    }
    .exp-card-pendant {
      width: 140px; opacity: 0.85;
      filter: drop-shadow(0 4px 24px rgba(123,82,200,0.4));
      margin-bottom: 12px;
      transition: width 0.15s ease-out;
    }
    .exp-card-body {
      padding: 10px 0 0;
      display: flex; flex-direction: column; gap: 10px;
      transition: gap 0.15s ease-out, padding 0.15s ease-out;
    }
    .exp-card-title {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 400;
      letter-spacing: .08em; text-transform: uppercase;
      color: #fff; line-height: 1.4;
      transition: font-size 0.15s ease-out;
    }

    .explore-bottom-spacer { height: 220px; }

    /* ── Gallery grid ────────────────────────────────────────── */
    #explore-section { display: flex; flex-direction: column; }
    #explore-section .exp-section-head { flex-shrink: 0; padding-bottom: 0; }
    .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px 18px 18px; }
    .gallery-card { position: relative; min-width: 0; }
    .gallery-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 2px; display: block; }
    .gallery-save-btn {
      position: absolute; top: 6px; right: 6px;
      width: 26px; height: 26px;
      background: rgba(0,0,0,0.55); border: none; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
    }
    .gallery-save-btn svg { transition: fill 0.15s; }
    .gallery-save-btn.saved svg path { fill: #fff; }
    .gallery-meta { padding: 5px 0 8px; }
    .gallery-artist {
      font-family: 'Inter', sans-serif; font-size: 8px; font-weight: 600;
      letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.8);
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .gallery-title {
      font-family: 'Inter', sans-serif; font-size: 7px; font-weight: 400;
      letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.35);
      display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
  </style>
</head>
<body>
<div class="phone">

  <div class="dynamic-island"></div>
  <div class="bg"></div>
  <div class="light-beam"></div>
  <div class="ground-glow"></div>
  <div class="vignette"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="6" width="3" height="6" rx="0.5" opacity="0.3"/><rect x="4.5" y="4" width="3" height="8" rx="0.5" opacity="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5" opacity="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="white"/><path d="M4.9 7.4a4.4 4.4 0 0 1 6.2 0" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M2.4 5a7.2 7.2 0 0 1 11.2 0" stroke="white" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="white" stroke-width="1" fill="none" opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="white"/><path d="M22.5 4v4a2 2 0 0 0 0-4z" fill="white" opacity="0.4"/></svg>
    </div>
  </div>

  <!-- Search bar — pinned above scroll, never moves -->
  <div class="exp-search-pinned">
    <div class="exp-search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span class="exp-search-placeholder">Search</span>
    </div>
    <div class="exp-divider"></div>
  </div>

  <!-- Explore Content -->
  <div class="explore-content">

    <!-- Featured (pinned, shrinks on scroll) -->
    <div class="featured-sticky">

      <!-- Colour Stories cards -->
      <div class="exp-section-head">
        <h2 class="exp-section-title" id="featured-title">Featured</h2>
      </div>

      <div class="exp-cards-scroll">

        <!-- Card 1 — Floral -->
        <a class="exp-card" href="explore-dusty-rose.html">
          <div class="exp-card-img">
            <img src="assets/monet-waterlilies.jpg" alt="Monet — Impression, Sunrise" style="position:absolute;top:0;right:0;width:230px;height:290px;object-fit:cover;object-position:top right">
            <span class="exp-card-badge">SS26</span>
          </div>
          <div class="exp-card-body">
            <div class="exp-card-title">The Dusty Rose Edit</div>
          </div>
        </a>

        <!-- Card 2 — Pearl Edit -->
        <a class="exp-card" href="explore-pearl.html">
          <div class="exp-card-img">
            <img src="assets/pearl-edit-hero.jpg" alt="The Pearl Edit" style="position:absolute;top:0;right:0;width:230px;height:290px;object-fit:cover;object-position:top center">
            <span class="exp-card-badge">FW26</span>
          </div>
          <div class="exp-card-body">
            <div class="exp-card-title">The Pearl Edit</div>
          </div>
        </a>

        <!-- Card 3 — Illusions Edit -->
        <a class="exp-card" href="explore-illusions.html">
          <div class="exp-card-img">
            <img src="assets/illusion-edit-hero.jpg" alt="The Illusions Edit" style="position:absolute;top:0;right:0;width:230px;height:290px;object-fit:cover;object-position:top center">
            <span class="exp-card-badge">SS27</span>
          </div>
          <div class="exp-card-body">
            <div class="exp-card-title">The Illusions Edit</div>
          </div>
        </a>

      </div>

      <div id="explore-divider" class="exp-divider" style="margin-top:18px;margin-bottom:0"></div>

    </div>

    <div id="explore-section">

    <div class="exp-section-head">
      <h2 class="exp-section-title">Gallery</h2>
    </div>

    <div class="gallery-grid" id="gallery-grid"></div>

    </div><!-- /explore-section -->

  </div><!-- /explore-content -->

  <!-- Tab Bar -->
  <div class="tab-bar">
    <div class="tabs">
      <a class="tab" href="screen-closet.html">
        <div class="tab-ic">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg>
        </div>
        <span class="tab-lbl" style="opacity:.5">Closet</span>
      </a>
      <a class="tab" href="screen-explore.html">
        <div class="tab-ic">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg>
        </div>
        <span class="tab-lbl">Explore</span>
      </a>
      <a class="tab" href="Index.html">
        <div class="tab-ic">
          <svg width="22" height="22" fill="none" style="transform:rotate(-30deg);opacity:.5">
            <ellipse cx="11" cy="11" rx="9" ry="6.5" stroke="white" stroke-width="1.3"/>
            <ellipse cx="11" cy="11" rx="5.5" ry="4" stroke="white" stroke-width="1.3"/>
            <ellipse cx="11" cy="11" rx="2" ry="1.5" stroke="white" stroke-width="1.3"/>
          </svg>
        </div>
        <span class="tab-lbl" style="opacity:.5">Luminora</span>
      </a>
      <a class="tab" href="screen-profile.html">
        <div class="tab-ic">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg>
        </div>
        <span class="tab-lbl" style="opacity:.5">Profile</span>
      </a>
    </div>
    <div class="home-bar"><div class="hb"></div></div>
  </div>

</div>

<script>
  // ── Gallery ──────────────────────────────────────────────────
  var PAINTINGS = [
    { file: 'adja yunkers - composition in black & ochre.jpg', artist: 'Adja Yunkers', title: 'Composition in Black & Ochre' },
    { file: 'agnes martin - white flower.jpg', artist: 'Agnes Martin', title: 'White Flower' },
    { file: 'beatriz milhazes - in albis.jpg', artist: 'Beatriz Milhazes', title: 'In Albis' },
    { file: 'elaine de kooning - juarez.jpg', artist: 'Elaine de Kooning', title: 'Juarez' },
    { file: 'emil nolde - young horses.jpg', artist: 'Emil Nolde', title: 'Young Horses' },
    { file: 'franz marc - yellow cow.jpg', artist: 'Franz Marc', title: 'Yellow Cow' },
    { file: 'gabriele munter - snow-covered fir tree.jpg', artist: 'Gabriele Münter', title: 'Snow-Covered Fir Tree' },
    { file: 'helen frankenthaler - canal.jpg', artist: 'Helen Frankenthaler', title: 'Canal' },
    { file: 'hilla rebay - composition I.jpg', artist: 'Hilla Rebay', title: 'Composition I' },
    { file: 'joan miro - the flight of a bird over the plain III.jpg', artist: 'Joan Miró', title: 'The Flight of a Bird Over the Plain III' },
    { file: 'maria helena vieira da silva - Aix-en-Provence.jpg', artist: 'Maria Helena Vieira da Silva', title: 'Aix-en-Provence' },
    { file: 'natalia goncharova - cats.jpg', artist: 'Natalia Goncharova', title: 'Cats' },
    { file: 'pablo picasso - bird on a tree.jpg', artist: 'Pablo Picasso', title: 'Bird on a Tree' },
    { file: 'rufino tamayo - woman in grey.jpg', artist: 'Rufino Tamayo', title: 'Woman in Grey' }
  ];

  var savedMedia = JSON.parse(localStorage.getItem('aim_media') || '[]');

  function isSaved(file) {
    return savedMedia.some(function(s){ return s.file === file; });
  }

  function toggleSave(idx) {
    var p = PAINTINGS[idx];
    var i = savedMedia.findIndex(function(s){ return s.file === p.file; });
    if (i >= 0) { savedMedia.splice(i, 1); } else { savedMedia.push(p); }
    localStorage.setItem('aim_media', JSON.stringify(savedMedia));
    var btn = document.getElementById('gsave-' + idx);
    btn.classList.toggle('saved', isSaved(p.file));
  }

  function renderGallery() {
    var grid = document.getElementById('gallery-grid');
    grid.innerHTML = PAINTINGS.map(function(p, i) {
      var saved = isSaved(p.file);
      return '<div class="gallery-card">' +
        '<img class="gallery-img" src="assets/' + encodeURIComponent(p.file) + '" alt="' + p.title + '">' +
        '<button id="gsave-' + i + '" class="gallery-save-btn' + (saved ? ' saved' : '') + '" onclick="toggleSave(' + i + ')">' +
          '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="' + (saved ? '#fff' : 'rgba(255,255,255,0.5)') + '"/></svg>' +
        '</button>' +
        '<div class="gallery-meta">' +
          '<span class="gallery-artist">' + p.title + '</span>' +
          '<span class="gallery-title">' + p.artist + '</span>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  renderGallery();

  const exploreContent = document.querySelector('.explore-content');
  const featuredTitle = document.getElementById('featured-title');
  const sectionHead = document.querySelector('.featured-sticky .exp-section-head');
  const exploreDivider = document.getElementById('explore-divider');
  const cardImgs = document.querySelectorAll('.exp-card-img');
  const pendants = document.querySelectorAll('.exp-card-pendant');
  const cardBadges = document.querySelectorAll('.exp-card-badge');
  const cardBodies = document.querySelectorAll('.exp-card-body');
  const cardTitles = document.querySelectorAll('.exp-card-title');
  const MAX_H = 290, MIN_H = 130;
  const PENDANT_MAX = 190;

  const cardsScroll = document.querySelector('.exp-cards-scroll');
  const exploreSection = document.getElementById('explore-section');
  const ANIM_RANGE = 200;
  const lift_total = cardsScroll.getBoundingClientRect().top - sectionHead.getBoundingClientRect().top;

  const PHASE1_FACTOR = 1 - lift_total / ANIM_RANGE;
  const MAX_TRANSLATE = ANIM_RANGE - lift_total;

  exploreContent.addEventListener('scroll', () => {
    const progress = Math.min(exploreContent.scrollTop / ANIM_RANGE, 1);
    // Gallery tracks the divider line during phase 1, then scrolls freely in phase 2
    exploreSection.style.transform = 'translateY(' + Math.min(exploreContent.scrollTop * PHASE1_FACTOR, MAX_TRANSLATE) + 'px)';
    const h = MAX_H - (MAX_H - MIN_H) * progress;
    const lift = lift_total * progress;
    cardImgs.forEach(img => img.style.height = h + 'px');
    pendants.forEach(p => p.style.width = (PENDANT_MAX * (h / MAX_H)) + 'px');
    cardBadges.forEach(badge => badge.style.opacity = progress >= 0.4 ? '0' : String(Math.max(0, 1 - progress * 2.5)));
    cardsScroll.style.transform = 'translateY(-' + lift + 'px)';
    exploreDivider.style.transform = 'translateY(-' + lift + 'px)';
    cardTitles.forEach(t => t.style.fontSize = (11 - 2 * progress) + 'px');
    cardBodies.forEach(body => {
      body.style.gap = (10 - 4 * progress) + 'px';
      body.style.paddingTop = (10 - 4 * progress) + 'px';
    });
  });

  exploreContent.addEventListener('scrollend', () => {
    const progress = Math.min(exploreContent.scrollTop / ANIM_RANGE, 1);
    if (progress >= 0.4) cardBadges.forEach(badge => badge.style.opacity = '0');
  });
</script>
</body>
</html>
