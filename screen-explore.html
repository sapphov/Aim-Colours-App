<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, initial-scale=1.0" />
  <title>Luminora — Explore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Black background ───────────────────────────────────── */
    .bg { background: #151718; }
    .light-beam, .ground-glow, .vignette { display: none; }

    /* ── studio-02 tab bar ───────────────────────────────────── */
    .tab-bar { background: #151718; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .tabs { height: 72px; border-top: none; display: flex; align-items: center; justify-content: space-evenly; padding: 0 8px; }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; }
    .tab-ic { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
    .tab-ic svg { height: 22px; width: 22px; }
    .tab-lbl { font-size: 7px; letter-spacing: .18em; text-transform: uppercase; color: #fff; font-weight: 500; }
    .home-bar { height: 34px; display: flex; align-items: center; justify-content: center; }
    .hb { width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); }

    /* ── Explore scrollable content ─────────────────────────── */
    .explore-content {
      position: absolute;
      top: 48px; bottom: 106px; left: 0; right: 0;
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: none;
      z-index: 5;
    }
    .explore-content::-webkit-scrollbar { display: none; }

    /* Search bar */
    .exp-search {
      display: flex; align-items: center; gap: 10px;
      margin: 14px 18px 0;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      padding: 11px 14px;
      background: rgba(255,255,255,0.04);
    }
    .exp-search-placeholder {
      font-family: 'Inter', sans-serif;
      font-size: 11px; letter-spacing: 0.22em;
      text-transform: uppercase; color: rgba(255,255,255,0.4);
    }

    .exp-divider {
      height: 0.5px;
      background: rgba(255,255,255,0.15);
      margin: 18px 0 0;
    }

    /* Section headings */
    .exp-section-head {
      padding: 16px 18px 10px;
    }
    .exp-section-title {
      font-family: 'Inter', sans-serif;
      font-size: 27px; font-weight: 400;
      letter-spacing: .04em; text-transform: uppercase;
      color: #fff; line-height: 1.2;
    }

    /* ── Feature cards ───────────────────────────────────────── */
    .exp-cards-scroll {
      display: flex; gap: 10px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      padding: 4px 18px 18px;
    }
    .exp-cards-scroll::-webkit-scrollbar { display: none; }

    .exp-card {
      flex-shrink: 0;
      width: 230px;
      display: flex; flex-direction: column;
    }
    .exp-card-img {
      width: 230px; height: 290px;
      border-radius: 2px;
      position: relative; overflow: hidden;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .exp-card-badge {
      position: absolute; top: 12px; left: 12px;
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 8px; font-weight: 600;
      letter-spacing: 0.2em; text-transform: uppercase;
      color: #000; padding: 5px 9px;
    }
    .exp-card-pendant {
      width: 140px; opacity: 0.85;
      filter: drop-shadow(0 4px 24px rgba(123,82,200,0.4));
      margin-bottom: 12px;
    }
    .exp-card-body {
      padding: 10px 0 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    .exp-card-title {
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 400;
      letter-spacing: .08em; text-transform: uppercase;
      color: #fff; line-height: 1.4;
    }
    .exp-card-btn {
      align-self: flex-start;
      background: transparent;
      border: 1.5px solid #fff;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 8px; font-weight: 600;
      letter-spacing: 0.22em; text-transform: uppercase;
      padding: 8px 14px; cursor: pointer;
      border-radius: 2px;
    }

    /* ── Topics list ─────────────────────────────────────────── */
    .exp-topics { padding: 0 0 8px; }

    .exp-topic-row {
      display: flex; align-items: center; gap: 14px;
      padding: 0 18px;
      height: 82px;
      border-bottom: 0.5px solid rgba(255,255,255,0.12);
    }
    .exp-topic-row:last-child {
      border-bottom: none;
    }
    .exp-topic-thumb {
      width: 66px; height: 66px;
      border-radius: 2px; flex-shrink: 0;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
    }
    .exp-topic-thumb img {
      width: 54px; height: 54px;
      filter: drop-shadow(0 2px 8px rgba(123,82,200,0.5));
    }
    .exp-topic-name {
      flex: 1;
      font-family: 'Inter', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: #fff;
    }
    .exp-topic-arrow { flex-shrink: 0; opacity: 0.7; cursor: pointer; }
  </style>
</head>
<body>
