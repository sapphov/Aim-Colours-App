<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, initial-scale=1.0" />
  <title>Aim Colours — Colour Personality Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Quiz flow — light editorial theme, per Figma ── */
    .phone.quiz-flow { background: #FFF5F1; display: flex; flex-direction: column; }
    .quiz-flow .home-indicator-bar { background: rgba(53,32,31,0.3); }

    /* Nav row: back chevron + close */
    .quiz-nav {
      position: relative; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px 0; flex-shrink: 0;
    }
    .quiz-back-btn {
      display: flex; align-items: center; padding: 4px;
    }
    .quiz-close-btn {
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 29px;
      border: 1.5px solid #35201F; border-radius: 4px;
    }

    /* Step container */
    .quiz-step { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .quiz-step-content {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: none;
      padding: 22px 22px 0;
    }
    .quiz-step-content::-webkit-scrollbar { display: none; }

    .quiz-question {
      font-family: 'Inter', sans-serif;
      font-weight: 400; font-size: 26px;
      color: #35201F; letter-spacing: -0.02em; line-height: 1.3;
      margin-bottom: 22px;
    }

    /* Zodiac grid */
    .zodiac-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px 12px;
      padding-bottom: 24px;
    }
    .zodiac-option {
      background: none; border: 1.5px solid transparent; border-radius: 9px;
      padding: 18px 4px 14px;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .zodiac-option img {
      width: 34px; height: 34px; object-fit: contain;
      margin-bottom: 14px;
    }
    .zodiac-option span {
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 400;
      color: #35201F;
    }
    .zodiac-option.selected { border-color: var(--purple-light); }

    /* Next button */
    .quiz-next-wrap { padding: 4px 22px 20px; flex-shrink: 0; }
    .quiz-next {
      width: 100%; background: none; border: 1.5px solid #35201F;
      color: #35201F; font-family: 'Inter', sans-serif;
      font-size: 15px; font-weight: 500;
      padding: 11px; border-radius: 3px; cursor: pointer;
    }
  </style>
</head>
<body>
<div class="phone quiz-flow">

  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time" style="color:#35201F">9:41</span>
    <div class="status-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#35201F"><rect x="0" y="6" width="3" height="6" rx="0.5" opacity="0.3"/><rect x="4.5" y="4" width="3" height="8" rx="0.5" opacity="0.5"/><rect x="9" y="2" width="3" height="10" rx="0.5" opacity="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 10.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2z" fill="#35201F"/><path d="M4.9 7.4a4.4 4.4 0 0 1 6.2 0" stroke="#35201F" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M2.4 5a7.2 7.2 0 0 1 11.2 0" stroke="#35201F" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.6"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#35201F" stroke-width="1" fill="none" opacity="0.35"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="#35201F"/><path d="M22.5 4v4a2 2 0 0 0 0-4z" fill="#35201F" opacity="0.4"/></svg>
    </div>
  </div>

  <!-- Nav -->
  <div class="quiz-nav">
    <a class="quiz-back-btn" href="screen-quiz.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24"><path fill="#35201F" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg>
    </a>
    <a class="quiz-close-btn" href="screen-quiz.html">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"><path fill="#35201F" d="M18.36 19.78L12 13.41l-6.36 6.37l-1.42-1.42L10.59 12L4.22 5.64l1.42-1.42L12 10.59l6.36-6.36l1.41 1.41L13.41 12l6.36 6.36z"/></svg>
    </a>
  </div>

  <!-- Step: Zodiac sign -->
  <div class="quiz-step" id="step-zodiac">
    <div class="quiz-step-content">
      <div class="quiz-question">What's your zodiac sign?</div>
      <div class="zodiac-grid">
        <button class="zodiac-option" data-sign="Capricorn" onclick="selectZodiac(this)">
          <img src="assets/zodiac-capricorn.png" alt="Capricorn"><span>Capricorn</span>
        </button>
        <button class="zodiac-option" data-sign="Aquarius" onclick="selectZodiac(this)">
          <img src="assets/zodiac-aquarius.png" alt="Aquarius"><span>Aquarius</span>
        </button>
        <button class="zodiac-option" data-sign="Pisces" onclick="selectZodiac(this)">
          <img src="assets/zodiac-pisces.png" alt="Pisces"><span>Pisces</span>
        </button>
        <button class="zodiac-option" data-sign="Aries" onclick="selectZodiac(this)">
          <img src="assets/zodiac-aries.png" alt="Aries"><span>Aries</span>
        </button>
        <button class="zodiac-option" data-sign="Taurus" onclick="selectZodiac(this)">
          <img src="assets/zodiac-taurus.png" alt="Taurus"><span>Taurus</span>
        </button>
        <button class="zodiac-option" data-sign="Gemini" onclick="selectZodiac(this)">
          <img src="assets/zodiac-gemini.png" alt="Gemini"><span>Gemini</span>
        </button>
        <button class="zodiac-option" data-sign="Cancer" onclick="selectZodiac(this)">
          <img src="assets/zodiac-cancer.png" alt="Cancer"><span>Cancer</span>
        </button>
        <button class="zodiac-option" data-sign="Leo" onclick="selectZodiac(this)">
          <img src="assets/zodiac-leo.png" alt="Leo"><span>Leo</span>
        </button>
        <button class="zodiac-option" data-sign="Virgo" onclick="selectZodiac(this)">
          <img src="assets/zodiac-virgo.png" alt="Virgo"><span>Virgo</span>
        </button>
        <button class="zodiac-option" data-sign="Libra" onclick="selectZodiac(this)">
          <img src="assets/zodiac-libra.png" alt="Libra"><span>Libra</span>
        </button>
        <button class="zodiac-option" data-sign="Scorpio" onclick="selectZodiac(this)">
          <img src="assets/zodiac-scorpio.png" alt="Scorpio"><span>Scorpio</span>
        </button>
        <button class="zodiac-option" data-sign="Sagittarius" onclick="selectZodiac(this)">
          <img src="assets/zodiac-sagittarius.png" alt="Sagittarius"><span>Sagittarius</span>
        </button>
      </div>
    </div>
    <div class="quiz-next-wrap">
      <button class="quiz-next" onclick="nextStep()">Next</button>
    </div>
  </div>

  <div class="home-indicator"><div class="home-indicator-bar"></div></div>

</div>

<script>
  var selectedZodiac = null;

  function selectZodiac(el) {
    document.querySelectorAll('.zodiac-option.selected').forEach(function(o) { o.classList.remove('selected'); });
    el.classList.add('selected');
    selectedZodiac = el.dataset.sign;
    localStorage.setItem('aim_quiz_zodiac', selectedZodiac);
  }

  function nextStep() {
    // Step 2 (inkblot question) not built yet — reserved for the next round.
  }
</script>
</body>
</html>
