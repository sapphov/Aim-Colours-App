<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=393, initial-scale=1.0" />
  <title>Aim Colours — Shoes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f0ede8; }

    .phone { background: #fff; display:flex; flex-direction:column; }

    /* Status bar */
    .status-bar { background: #fff; }

    /* Header */
    .sg-header {
      display: flex; align-items: center;
      padding: 8px 10px 10px;
      background: #fff;
      flex-shrink: 0;
    }
    .sg-back {
      display: flex; align-items: center; flex-shrink: 0;
      text-decoration: none;
    }
    .sg-title {
      font-family: 'Inter', sans-serif;
      font-size: 28px; font-weight: 400;
      color: #000; letter-spacing: -0.02em;
      flex: 1; padding-left: 8px;
    }

    /* Scrollable content */
    .sg-content {
      flex: 1; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      background: #fff;
      scrollbar-width: none;
    }
    .sg-content::-webkit-scrollbar { display: none; }

    /* Divider */
    .sg-divider {
      height: 0.5px;
      background: rgba(0,0,0,0.12);
      margin: 0 10px;
    }

    /* Section */
    .sg-section { padding-bottom: 4px; }
    .sg-section-label {
      font-family: 'Inter', sans-serif;
      font-size: 18px; font-weight: 400;
      color: #000; letter-spacing: -0.02em;
      padding: 6px 10px 10px;
    }

    /* Scroll row */
    .sg-scroll-wrap {
      position: relative;
      padding-bottom: 24px;
    }
    .sg-row {
      display: flex;
      gap: 16px;
      align-items: center;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none;
      padding: 0 10px 0;
    }
    .sg-row::-webkit-scrollbar { display: none; }

    /* Shoe card */
    .sg-item {
      flex-shrink: 0;
      width: 250px; height: 160px;
      background: #f7f6f4;
      border-radius: 10px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .sg-item img {
      width: 90%; height: 90%;
      object-fit: contain;
    }

    /* Scroll indicator */
    .sg-track {
      position: absolute; bottom: 6px; left: 10px; right: 10px;
      height: 1.5px; background: rgba(0,0,0,0.12); border-radius: 1px;
    }
    .sg-thumb {
      position: absolute; bottom: 6px; left: 10px;
      height: 1.5px; width: 60px;
      background: #000; border-radius: 1px;
      transition: left 0.1s;
    }

    /* Tab bar — match screen-closet.html */
    .tabs { background:#0d0d0d; height:72px; border-top:.5px solid rgba(255,255,255,.15); display:flex; align-items:center; justify-content:space-evenly; padding:0 8px; flex-shrink:0; }
    .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; text-decoration:none; }
    .tab-ic { width:24px; height:24px; opacity:1; display:flex; align-items:center; justify-content:center; }
    .tab-ic svg { height:22px; width:22px; }
    .tab-lbl { font-size:7px; letter-spacing:.18em; text-transform:uppercase; color:#fff; font-weight:500; }
    .home-bar { background:#0d0d0d; height:34px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .hb { width:134px; height:5px; border-radius:3px; background:rgba(255,255,255,.3); }
  </style>
</head>
<body>
<div class="phone">

  <div class="dynamic-island"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <img src="status-time.svg" alt="9:41" style="position:absolute;left:21px;top:12px;width:54px;height:21px;filter:brightness(0)"/>
    <img src="status-icons.svg" alt="status icons" style="position:absolute;right:14.67px;top:17.33px;width:66.661px;height:11.336px;filter:brightness(0)"/>
  </div>

  <!-- Header -->
  <div class="sg-header">
    <a class="sg-back" href="screen-closet.html?nosplash=1"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24"><path fill="black" d="m10 18l-6-6l6-6l1.4 1.45L7.85 11H20v2H7.85l3.55 3.55z"/></svg></a>
    <div class="sg-title">Shoes</div>
  </div>
  <div class="sg-divider"></div>

  <!-- Content -->
  <div class="sg-content">

    <!-- Archive -->
    <div class="sg-section">
      <div class="sg-section-label" style="padding-top: 16px">Archive</div>
      <div class="sg-scroll-wrap">
        <div class="sg-row" id="row-archive">
          <div class="sg-item"><img src="assets/shoes_red.png" alt="red shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_white_heels.png" alt="white heels" /></div>
          <div class="sg-item"><img src="assets/shoes_blue.png" alt="blue shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_purple.png" alt="purple shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_purple_heels.png" alt="purple heels" /></div>
          <div class="sg-item"><img src="assets/shoes_mint_blue.png" alt="mint blue shoes" /></div>
        </div>
        <div class="sg-track"></div>
        <div class="sg-thumb" id="thumb-archive"></div>
      </div>
    </div>

    <!-- Created by Friends -->
    <div class="sg-section">
      <div class="sg-section-label">Created by Friends</div>
      <div class="sg-scroll-wrap">
        <div class="sg-row" id="row-friends">
          <div class="sg-item"><img src="assets/shoes_mint_blue.png" alt="mint blue shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_purple.png" alt="purple shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_brown_bow_heels.png" alt="brown bow heels" /></div>
          <div class="sg-item"><img src="assets/shoes_blue.png" alt="blue shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_red.png" alt="red shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_black_white_flats.png" alt="black and white flats" /></div>
        </div>
        <div class="sg-track"></div>
        <div class="sg-thumb" id="thumb-friends"></div>
      </div>
    </div>

    <!-- Recently Worn -->
    <div class="sg-section">
      <div class="sg-section-label">Recently Worn</div>
      <div class="sg-scroll-wrap">
        <div class="sg-row" id="row-recent">
          <div class="sg-item"><img src="assets/shoes_blue.png" alt="blue shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_red.png" alt="red shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_brown_heels.png" alt="brown heels" /></div>
          <div class="sg-item"><img src="assets/shoes_mint_blue.png" alt="mint blue shoes" /></div>
          <div class="sg-item"><img src="assets/shoes_purple.png" alt="purple shoes" /></div>
        </div>
        <div class="sg-track"></div>
        <div class="sg-thumb" id="thumb-recent"></div>
      </div>
    </div>

  </div>

  <!-- Tab Bar -->
  <div class="tabs">
    <a class="tab" href="screen-closet.html" style="text-decoration:none">
      <div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 16 16"><path fill="white" d="M8 3a1 1 0 0 0-.943.667a.5.5 0 0 1-.942-.334a2 2 0 1 1 3.22 2.157l-.041.037c-.22.197-.419.374-.57.566c-.16.198-.223.359-.223.503c0 .219.12.42.313.524L14.16 10a1.596 1.596 0 0 1-.757 3H2.595a1.595 1.595 0 0 1-.755-3l4.423-2.38a.5.5 0 0 1 .474.88l-4.424 2.38A.595.595 0 0 0 2.595 12h10.81a.596.596 0 0 0 .282-1.12L8.34 8a1.6 1.6 0 0 1-.84-1.404c0-.462.212-.839.44-1.126c.208-.261.468-.493.674-.677l.054-.048A1 1 0 0 0 8 3"/></svg></div>
      <span class="tab-lbl">Closet</span>
    </a>
    <a class="tab" href="screen-explore.html" style="text-decoration:none">
      <div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" style="opacity:.5"><path fill="white" d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/></svg></div>
      <span class="tab-lbl" style="opacity:.5">Explore</span>
    </a>
    <a class="tab" href="Index.html" style="text-decoration:none">
      <div class="tab-ic"><svg width="22" height="22" fill="none" style="transform:rotate(-30deg)"><ellipse cx="11" cy="11" rx="9" ry="6.5" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="5.5" ry="4" stroke="white" stroke-width="1.3" opacity=".5"/><ellipse cx="11" cy="11" rx="2" ry="1.5" stroke="white" stroke-width="1.3" opacity=".5"/></svg></div>
      <span class="tab-lbl" style="opacity:.5">Luminora</span>
    </a>
    <a class="tab" href="screen-profile.html" style="text-decoration:none">
      <div class="tab-ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 16 16" style="opacity:.5"><path fill="white" d="M8 8a3 3 0 1 0 0-6a3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0a2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1s1-4 6-4s6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg></div>
      <span class="tab-lbl" style="opacity:.5">Profile</span>
    </a>
  </div>
  <div class="home-bar"><div class="hb"></div></div>

</div>

<script>
  const rows = [
    { row: 'row-archive', thumb: 'thumb-archive' },
    { row: 'row-friends', thumb: 'thumb-friends' },
    { row: 'row-recent',  thumb: 'thumb-recent'  },
  ];

  rows.forEach(({ row, thumb }) => {
    const rowEl   = document.getElementById(row);
    const thumbEl = document.getElementById(thumb);
    if (!rowEl || !thumbEl) return;

    rowEl.addEventListener('scroll', () => {
      const scrollMax = rowEl.scrollWidth - rowEl.clientWidth;
      const ratio     = scrollMax > 0 ? rowEl.scrollLeft / scrollMax : 0;
      const trackWidth = rowEl.parentElement.querySelector('.sg-track').offsetWidth;
      const thumbWidth = 60;
      thumbEl.style.left = (10 + ratio * (trackWidth - thumbWidth)) + 'px';
    });
  });
</script>
</body>
</html>
